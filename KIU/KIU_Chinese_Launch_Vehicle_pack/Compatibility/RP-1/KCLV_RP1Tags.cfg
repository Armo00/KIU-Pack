// ============================================================
// KCLV_RP1Patch - Module Tags (KCLV - Launch Vehicle pack)
//
// Purpose:
//   Add RP-1 ModuleTagList tags to KCLV parts so they participate
//   in RP-1's tooling, procurement, human-rating and reentry
//   systems. Applied BEFORE[zzzRP-0] so tags are present before
//   RP-1 cleanup.
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//   - KIU  (GameData folder: KIU)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- EngineLiquidTurbo ----------
// 涡轮泵液体发动机（煤油/甲烷/氢氧）。影响 RP-1 发动机 Tooling 与 ECM 分组。
// 15 part(s)
@PART[KCLV_TQ-11|KCLV_TQ12|KCLV_TQ13_With_Shell|KCLV_TQ15A|KCLV_YF100|KCLV_YF100M|KCLV_YF115|KCLV_YF-20_Series_Engine|KCLV_YF-21C|KCLV_YF22|KCLV_YF23V|KCLV_YZ3Engine|KCLV_YF75|KCLV_YF75E|KCLV_YF50E]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = EngineLiquidTurbo }
}

// ---------- Hydrolox ----------
// 氢氧发动机子集（YF-75/75E/50E，YZ3 远征三号用 YF-50D 氢氧）。附加 Hydrolox 标签以归入氢氧技术族。
// 4 part(s)
@PART[KCLV_YF75|KCLV_YF75E|KCLV_YF50E|KCLV_YZ3Engine]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = Hydrolox }
}

// ---------- EngineLiquidPF ----------
// 挤压式/单组元液体发动机与 RCS 推力器。
// 1 part(s)
@PART[KCLV_YL-1_Stage3_RCS]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = EngineLiquidPF }
}

// ---------- EngineSolid ----------
// 固体助推器/固体级 + 逃逸塔固体发动机。

@PART[KCLV_CZ6A_Booster|KCLV_YL-1_Booster|KCLV_YL-1_Stage1|KCLV_YL-1_Stage2|KCLV_YL-1_Stage3|KCLV_CZ2F_Escape_tower|KCLV_CZ2F_Escape_tower_Upper|KCLV_CZ-10_Escape_Tower_Upper|KCLV_CZ-10_Escape_Tower_Lower|KCLV_CZ2F_high_altitude_abort_Engine]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = EngineSolid }
}


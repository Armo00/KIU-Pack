// ============================================================
// KCLV_RP1Avionics (KCLV - Launch Vehicle pack)
// RP-1 avionics (ModuleAvionics) patch for KCLV probe parts.
//
// Purpose:
//   KCLV avionics parts carry ModuleCommand with minimumCrew = 0
//   but no ModuleAvionics. RP-1's generic fallback (Avionics.cfg)
//   therefore injects ModuleAvionics with massLimit = 0, making
//   these craft uncontrollable. This patch injects ModuleAvionics
//   with a real massLimit at BEFORE[RP-0] (before the AFTER[RP-0]
//   fallback), so the fallback skips them.
//
// massLimit basis: public liftoff mass + LEO payload capacity +
// a >=50t margin. Zhuque-3 is handled separately (recoverable
// first stage, values tuned by user testing): stage 1 = 200t,
// stage 2 = 565t + 21t payload = 586t.
//
// Dependencies:
//   - RP-1  (ModuleManager identifier: RP-0)
//   - KIU   (GameData folder name: KIU)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// Long March 10 (CZ-10): liftoff ~2189t, LEO payload ~70t
@PART[KCLV_CZ-10_Stage1_Tank|KCLV_CZ-10_Instrument_Bay]:NEEDS[RP-0]:BEFORE[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 2310
	}
}


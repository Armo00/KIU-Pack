// ===========================================================================
// KCLV RP-1 开模(Tooling)补丁
// 按 RP-1 现有定义(SSPX.cfg 写法)为固定尺寸部件显式添加 ModuleToolingDiamLen。
// 储箱 -> Tank-Sep-Al2 ; 结构件 -> Stringers
// 尺寸为公开数据/估算值，仅用于开模成本计算与 UI 展示。
// 发动机已由 ModuleEngineConfigs + RP-0 自行处理，无需在此添加。
// ===========================================================================

// ---------------- 储箱 (Tank-Sep-Al2) ----------------

@PART[KCLV_CZ2F_stage1]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	MODULE
	{
		name = ModuleToolingDiamLen
		toolingName = Tool Tank
		toolingType = Tank-Sep-Al2
		untooledMultiplier = 0.08

// ============================================================
// KCLV_RP1Patch - Tech Tree Mapping (KCLV - Launch Vehicle pack)
//
// Purpose:
//   Map every KCLV part's TechRequired from stock KSP nodes to
//   historical RP-1 tech-tree nodes, so parts unlock at the
//   correct year/node in RP-1 career mode.
//
//   Combined with KCLV_RP1Patch.cfg (which sets RP0conf=True),
//   this makes KCLV parts both visible and properly placed in
//   the RP-1 tree. Apply BEFORE[zzzRP-0] so the TechRequired
//   value is set before RP-1's NonRP0 cleanup pass.
//
// Mapping logic:
//   - Reference year = real first-flight / service year of the
//     part's real-world counterpart (planned year for future
//     vehicles like CZ-10).
//   - Category chosen by part function.
//   - Target node = the largest node year <= reference year in
//     that category, with manual overrides where the rule picks
//     a semantically wrong node.
//   - See readme/功能更新.md for the full rationale.
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//   - KIU  (GameData folder: KIU)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- RCS ----------
// reusableControl (2019) - 1 part(s)
@PART[KCLV_YL-1_Stage3_RCS]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    @TechRequired = reusableControl
}


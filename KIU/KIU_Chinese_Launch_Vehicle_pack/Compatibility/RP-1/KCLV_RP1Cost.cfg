// ============================================================
// KCLV_RP1Patch - Cost / EntryCost (KCLV - Launch Vehicle pack)
//
// Purpose:
//   Fill in the missing `entryCost` field on the KCLV escape
//   tower parts. All other KCLV parts already have cost/entryCost
//   defined (either on the PART root or via the KIU RealFuels
//   compatibility patches) and RP-1 does NOT overwrite those
//   values for parts with RP0conf=true, so no further cost work
//   is needed for them.
//
// Why only escape towers need this:
//   - Fuel tanks: KIU's RF patches add ModuleFuelTanks with
//     basemass=-1 + type=ServiceModule. RP-1 ProcCosts.cfg
//     (AFTER[xxxRP0]) then sets baseCost=-1, so tank dry cost is
//     computed automatically by RealFuels (0.015 * volume). The
//     PART-root `cost` is ignored; `entryCost` is left as-is.
//   - Engines: KIU's RF patches add ModuleEngineConfigs with per-
//     CONFIG `cost` deltas and an @entryCost on the PART. RP-1's
//     TREE-Engines.cfg matches CONFIGs by name and KIU's names are
//     not in that list, so KIU's own values stand.
//   - Parachutes: use RealChute RealChuteModule + ProceduralChute;
//     cost=0 is normal (cost comes from canopy material x area).
//   - Escape towers: PART root has `cost` but NO `entryCost`, and
//     the KIU RF patches do not add one either. Without an
//     entryCost the career unlock fee is wrong (0/default).
//
// ECM (EntryCostModifiers):
//   Not added. KIU engines are not in RP-1's ECM-Engines.cfg, so
//   config upgrades charge only the CONFIG `cost` delta with no
//   separate entry fee. This is acceptable for playability.
//
// Values:
//   entryCost set to ~5x the part `cost`, rounded, consistent with
//   other KIU solid motors (CZ6A_Booster ~6.7x, abort engine 3.3x).
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//   - KIU  (GameData folder: KIU)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- Escape towers (entryCost missing) ----------
// CZ-2F escape tower lower + CZ-10 escape tower upper/lower: cost=1500 -> entryCost=7500
// CZ-2F escape tower upper: cost=1000 -> entryCost=5000
@PART[KCLV_CZ2F_Escape_tower|KCLV_CZ-10_Escape_Tower_Upper|KCLV_CZ-10_Escape_Tower_Lower]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%entryCost = 7500
}

@PART[KCLV_CZ2F_Escape_tower_Upper]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%entryCost = 5000
}
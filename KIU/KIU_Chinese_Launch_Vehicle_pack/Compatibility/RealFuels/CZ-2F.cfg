// CZ-2F Escape Tower

// Gross mass: 0.5886t   Dry mass: 0.2t    Fuel mass: 0.3886t
@PART[KCLV_CZ2F_Escape_tower_Upper]:NEEDS[RealFuels]:FINAL
{
    @mass = 0.2
    @maxTemp = 2000

    @MODULE[ModuleEngines*]
    {
        @minThrust = 100
        @maxThrust = 100
        @heatProduction = 100
        %allowShutdown = False
        %throttleLocked = True
        !PROPELLANT,*{}
        PROPELLANT
        {
            name = PBAN
            ratio = 1.0
            DrawGauge = True
        }
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 240
            key = 1 200
        }
    }

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    RESOURCE
    {
        name = PBAN
        amount = 50
        maxAmount = 50
    }
    RESOURCE
    {
        name = Hydrazine
        amount = 300
        maxAmount = 300
    }
}


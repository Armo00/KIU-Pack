// CZ-2F Second Stage
// Gross mass: 91.5t    Dry mass: 5.5t      Fuel mass: 86t
// YF-22B(1.0t) + YF-23*4(0.05*4) + PA(0.3t) + Fueltank (4t)

@PART[KCLV_CZ2F_stage2]:NEEDS[RealFuels]:FINAL
{
    @mass = 4
    @maxTemp = 2000

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        type = Default
        volume = 75000
        basemass = -1
        TANK
        {
            name = UDMH
            amount = Full
            maxAmount = 46%
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 54%
        }
    }
}


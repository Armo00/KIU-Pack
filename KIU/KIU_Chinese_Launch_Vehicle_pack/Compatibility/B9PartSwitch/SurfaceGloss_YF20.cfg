// YF-20 family and four-engine YF-21C. Does not switch engines, thrust, gimbals,
// fairing geometry or the stock ModulePartVariants shell choices.
// Mapped and ordinary specular shaders use different highlight inputs.
// Default restores the original per-material values instead of imposing a common preset.
@PART[KCLV_YF-20_Series_Engine|KCLV_YF-21C]:NEEDS[B9PartSwitch]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = SurfaceGloss
        switcherDescription = #KCLV_Gloss_switcherDescription
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = false
        SUBTYPE
        {
            name = Default
            title = #KCLV_Gloss_Default
            defaultSubtypePriority = 1
        }
        SUBTYPE
        {
            name = Matte
            title = #KCLV_Gloss_Matte
            MATERIAL
            {
                COLOR
                {
                    shaderProperty = _SpecColor
                    color = 0.02,0.02,0.02,1
                }
                FLOAT
                {
                    shaderProperty = _Shininess
                    value = 0.01
                }
                TEXTURE
                {
                    shaderProperty = _SpecMap
                    texture = KIU/Common/KIU_Common_texture/Shared_MatteSpec.v1.0.0
                    isNormalMap = false
                }
            }
        }
    }
}

// ==== 表面材质开关（B9PartSwitch）：ZQ-3 · 非引擎件 ====
//
// 目的：压掉 KSP/Bumped Specular 的过强高光（贴图 alpha 通道缺失 → gloss=1）。
// 机制：B9PS 的 MATERIAL 节点改 renderer.material 的着色器属性 → 逐零件材质实例，
//       不动共享材质；切回 Default 会把原值写回；复制零件时先还原再克隆材质。
// 依赖：B9PartSwitch（未安装的玩家看不到此开关，零件保持原样）
//
// 约定：不使用通配符，逐零件列名；仅非引擎件（引擎本体见 Parts/Engines/）
// 回退：删掉本文件即可，零件 CFG 未被修改。
// 建立 2026-09-20

@PART[KCLV_ZQ3_Adapter|KCLV_ZQ3_Stage_2|KCLV_Zhuque3_5200_Fairing|KCLV_Zhuque3_Grid_Fin|KCLV_Zhuque3_Interstage|KCLV_Zhuque3_Interstage_RCS|KCLV_Zhuque3_Landing_Leg|KCLV_Zhuque3_Launch_Pad_With_Tower|KCLV_Zhuque3_Stage1_Tank]:NEEDS[B9PartSwitch]
{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = SurfaceGloss
		switcherDescription = #KCLV_Gloss_switcherDescription
		defaultSubtype = Default

		// ---- 原样：不施加任何修改 ----
		SUBTYPE
		{
			name = Default
			title = #KCLV_Gloss_Default
		}

		// ---- 哑光：压掉高光 ----
		SUBTYPE
		{
			name = Matte
			title = #KCLV_Gloss_Matte
			MATERIAL
			{
				COLOR
				{
					shaderProperty = _SpecColor
					color = 0.02,0.02,0.02,1
				}
				FLOAT
				{
					shaderProperty = _Shininess
					value = 0.01
				}
			}
		}
	}
}

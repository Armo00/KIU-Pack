@PART[KCLV_TQ-12A_Series_Engine_Cluster]:NEEDS[Waterfall,B9PartSwitch]:FINAL
{
    MODULE
    {
        name = ModuleWaterfallRemapControllerFix
        sourceController = ActualAtmo
        targetController = atmosphereDepth
    }

    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = TQ12AClusterPlumeSwitch
        switcherDescription = Plume Style
        switcherDescriptionPlural = Plume Styles
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = true

        SUBTYPE
        {
            name = KIUOriginal
            title = KIU Original
            primaryColor = SkyBlue
            secondaryColor = Cyan
            descriptionSummary = Original KIU TQ-12A cluster plume
        }
        SUBTYPE
        {
            name = MangoTechRemade
            title = MangoTech Remade
            primaryColor = Cyan
            secondaryColor = Orange
            descriptionSummary = Remade TQ-12A cluster plume by Jason (MangoTech)
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = TQ12A_V3_Mode1
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume
                        templateName = KIU-TQ-12A-MangoTech
                        overrideParentTransform = thrustTransform1
                        position = 0,0,0
                        rotation = 270,0,0
                        scale = 1,1.2,1
                        @scale[*] *= #$/rescaleFactor$
                    }
                }
            }
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = TQ12A_V3_Mode3
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = plume

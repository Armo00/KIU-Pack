// Waterfall config for TQ-12A single engine (Zhuque-3)

@PART[KCLV_TQ-12A_Series]:NEEDS[Waterfall]:FINAL
{
    !EFFECTS {}
    EFFECTS
    {
        running_closed
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/KW/sound_altloop2
                volume = 0.0 0.0
                volume = 0.01 0.1
                volume = 1.0 1.3
                pitch = 0.0 1
                pitch = 1.0 1
                loop = true
            }
            PREFAB_PARTICLE
            {
                prefabName = fx_smokeTrail_veryLarge
                transformName = thrustTransform
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.075 0.25
                emission = 1.0 1.25
                speed = 0.0 0.25
                speed = 1.0 1.0
                localOffset = 0, 0, 1
            }
        }
        engage
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/KW/sound_liq5
                volume = 0.4
                pitch = 1.0
                loop = false
            }
        }
        disengage
        {
            AUDIO
            {
                channel = Ship
                clip = sound_vent_soft
                volume = 0.4
                pitch = 2.0
                loop = false
            }
        }
        flameout
        {
            AUDIO
            {
                channel = Ship
                clip = sound_explosion_low
                volume = 0.4
                pitch = 2.0
                loop = false
            }
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = TQ-12A
        engineID = TQ-12A
        version = FixedRampRates

        CONTROLLER
        {
            name = ActualAtmo
            linkedTo = atmosphere_density
        }
        REMAPCONTROLLER
        {
            sourceController = ActualAtmo
            responseRateUp = 0
            responseRateDown = 0
            name = atmosphereDepth
            mappingCurve
            {
                key = 0 0 0 3
                key = 1 1 0 0
            }
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            responseRateUp = 10600
            responseRateDown = 10600
        }
        VELOCITYCONTROLLER
        {
            name = speed
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = 0,1
            noiseType = random
            randomSeed = True
            seed = 0
            scale = 1
            minimum = 0
            speed = 5
        }
        TEMPLATE
        {
            templateName = TQ-12A
            overrideParentTransform = thrustTransform
            position = 0,0,0
            rotation = 270, 0, 0
            scale = 1, 1, 1
            @scale[*] *= #$/rescaleFactor$
        }
        TEMPLATE
        {
            templateName = stock-kerolox-generator
            overrideParentTransform = smokePoint
            position = 0,0,0
            rotation = 0, 0, 0
            scale = 4, 2.5, 5
            @scale[*] *= #$/rescaleFactor$
        }
    }
}


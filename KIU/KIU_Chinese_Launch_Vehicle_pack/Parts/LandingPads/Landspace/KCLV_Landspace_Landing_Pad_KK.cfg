// Kerbal Konstructs static asset definition for the KIU Landspace landing pad.
// The matching part (Landspace_Landing_Pad.cfg, same folder) keeps its #keys for normal
// part localization; this KK copy is separate because it is loaded by Kerbal Konstructs.
//
// NOTE: Kerbal Konstructs reads these strings raw (ConfigUtil.ReadCFGNode, no Localizer call
// anywhere in KK) and shows them verbatim, so title/description/manufacturer MUST stay English
// literals here. A #key would be displayed verbatim as "#..." in the KK statics list.

STATIC:NEEDS[KerbalKonstructs]
{
	name = KCLV_Landspace_Landing_Pad_KK
	title = Landspace Landing Pad
	author = KIU
	mesh = Landspace_Landing_Pad.mu
	module = Part
	static = true
	category = Bases
	cost = 15000
	manufacturer = LandSpace Technology Corporation
	description = Landspace land-based recovery site designed for the vertical landing of Zhuque-3's first stage. Features a large concrete landing pad with markers, capable of withstanding the impact and high-temperature exhaust during rocket landing.
	DefaultFacilityType = RecoveryBase
	keepConvex = False
	isSquad = False
	isHidden = False
}

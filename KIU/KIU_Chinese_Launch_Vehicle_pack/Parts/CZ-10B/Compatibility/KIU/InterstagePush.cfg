// Reversible stock animation, with idempotent staging extension from PusherAnimatedInterstage.
@PART[KCLV_CZ-10B_Interstage]
{
    MODULE
    {
        name = ModuleAnimateGeneric
        animationName = CZ10BInterstagePush
        startEventGUIName = #CZ10B_Pusher_Extend
        endEventGUIName = #CZ10B_Pusher_Retract
        actionGUIName = #CZ10B_Pusher_Toggle
        // Keep PAW controls available before and after separation.
        allowManualControl = true
        actionAvailable = true
        eventAvailableEditor = true
        eventAvailableFlight = true
        eventAvailableEVA = false
        allowAnimationWhileShielded = true
        isOneShot = false
        disableAfterPlaying = false
    }
    MODULE
    {
        name = PusherAnimatedInterstage
    }
}

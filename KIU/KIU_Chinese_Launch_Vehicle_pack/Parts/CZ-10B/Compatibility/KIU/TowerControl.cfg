// Reuse TowerControl for independent lower-arm height; CZ10BLaunchErector retains tower extension and launch sequence ownership.
@PART[KCLV_CZ-10B_Launch_Erector]:NEEDS[TowerControl]
{
    MODULE
    {
        name = TowerControl
        serviceHeightOnly = true
        serviceStructureHeight = 10
        selectableHeightStep = true
        heightStep = 0.1
        serviceHeight0 = 5.122
        serviceHeight1 = 5.122
        SERVICE_HEIGHT
        {
            slot = 0
            transform = CZ10B_LowerArmHeight_Standard
            installedTransform = LowerStandard
            label = #CZ10B_LowerArmHeightStandard
            authoredHeight = 5.2
            minimum = 3
            topMargin = 0
            aboveSlot = -1
            separation = 0
        }
        SERVICE_HEIGHT
        {
            slot = 1
            transform = CZ10B_LowerArmHeight_LegR7
            installedTransform = LowerLegR7
            label = #CZ10B_LowerArmHeightLegR7
            authoredHeight = 5.2
            minimum = 3
            topMargin = 0
            aboveSlot = -1
            separation = 0
        }
    }
}

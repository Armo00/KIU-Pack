@PART[KCLV_YF219]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    @mass = 1
    @cost = 2500
    @maxTemp = 2200
    @MODULE[ModuleEnginesFX]
    {
        @name = ModuleEnginesRF
    }
    !MODULE[ModuleEngineConfigs],* {}
    !MODULE[ModuleAlternator],* {}
    !RESOURCE,* {}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEnginesRF
        engineID = YF219
        configuration = YF-219EV
        origMass = 1
        modded = false
        isMaster = true
        CONFIG
        {
            name = YF-219EV
            minThrust = 402.6
            maxThrust = 1589.2
            heatProduction = 100
            massMult = 1.2
            cost = 100
            gimbalRange = 8
            ullage = true
            pressureFed = false
            ignitions = 50
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.433735580953
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.566264419047
                DrawGauge = false
            }
            atmosphereCurve
            {
                key = 0 355
                key = 1 250
                key = 12 0.001
            }
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1
            }
        }
        CONFIG
        {
            name = YF-219E
            minThrust = 378.90721971277975
            maxThrust = 1495.6764867549666
            heatProduction = 100
            massMult = 1
            cost = 0
            gimbalRange = 8
            ullage = true
            pressureFed = false
            ignitions = 50
            PROPELLANT
            {
                name = LqdMethane
                ratio = 0.433735580953
                DrawGauge = true
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.566264419047
                DrawGauge = false
            }
            atmosphereCurve
            {
                key = 0 329
                key = 1 302
                key = 12 0.001
            }
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1
            }
        }
    }
    MODULE
    {
        name = KIUEngineModeCompatibility
        engineID = YF219
        seaLevelConfiguration = YF-219E
        vacuumConfiguration = YF-219EV
        seaLevelCost = 2500
        vacuumCost = 2600
        costScaleExponent = 3
    }
}

@PART[KCLV_YF219]:NEEDS[RealFuels,B9PartSwitch]:AFTER[RealFuels]
{
    @MODULE[ModuleEngineConfigs]
    {
        @isMaster = false
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[EngineMode]]
    {
        @SUBTYPE[Vacuum]
        {
            @addedMass = 0
            @addedCost = 0
        }
        @SUBTYPE[SeaLevel]
        {
            @addedMass = 0
            @addedCost = 0
        }
    }
}

@PART[KCLV_YF219]:NEEDS[RealFuels,!B9PartSwitch]:AFTER[RealFuels]
{
    @MODULE[ModuleEngineConfigs]
    {
        !CONFIG[YF-219E] {}
    }
}

// RF owns mass and engine scaling through its native scale event. The mode
// adapter owns the total scaled price; avoid a second generic TS modifier.
@PART[KCLV_YF219]:NEEDS[RealFuels,TweakScale]:FINAL
{
    @MODULE[TweakScale]
    {
        %TWEAKSCALEEXPONENTS[TweakScale]
        {
            %MassScale = 0
            %DryCost = 0
        }
    }
}

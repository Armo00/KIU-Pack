// Modified 2026-09-19
// CZ-10B -- RealFuels conversion.
//
// The tank blocks below are the author's own, restored unchanged apart from the
// second stage volume. They were already right: the ConfigurableTank plugin
// carries the geometry in realFuelsBaseVolume, and the volumes and percentages
// written here reproduce the stock propellant mass to within 0.1%.
//   1st stage: 526 935 L  34.87% Kerosene / 65.13% LqdOxygen  = 542.25 t
//              (stock: 48 802.65 LiquidFuel + 59 647.68 Oxidizer = 542.25 t)
//   2nd stage: 194 392 L  43.37% LqdMethane / 56.63% LqdOxygen = 161.48 t
//              (stock: 14 533.53 LiquidFuel + 17 763.20 Oxidizer = 161.48 t)
// The second stage carries 10 t more than the part shipped with, added at the
// existing mixture ratio: 12 037.90 L of extra volume at 0.000830710 t/L.
//
// The RCS blocks are new -- the pack had no RealFuels handling for them. Each
// unit is self-contained in stock; here the MonoPropellant becomes real
// hydrazine in a tank of the same physical size (300 L / 80 L), which carries
// the same propellant mass as the 75 / 20 units the parts hold without
// RealFuels. resourceFlowMode stays NO_FLOW, so each unit draws only from
// itself. They keep ModuleFuelTanks defaults: there is no author precedent to
// follow for an RCS tank.

// 1st Stage Tank
@PART[KCLV_CZ-10B_Stage1_Tank]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    !RESOURCE[LiquidFuel]
    {
    }
    !RESOURCE[Oxidizer]
    {
    }
    !MODULE[ModuleFuelTanks]
    {
    }
    MODULE
    {
        name = ModuleFuelTanks
        volume = 526935.088600007
        type = Default
        basemass = -1
        utilization = 100
        utilizationTweakable = false
        TANK
        {
            name = Kerosene
            amount = full
            maxAmount = 34.8700000000%
        }
        TANK
        {
            name = LqdOxygen
            amount = full
            maxAmount = 65.1300000000%
        }
    }
}

// 2nd Stage Tank
@PART[KCLV_CZ-10B_Stage2_Tank]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    !RESOURCE[LiquidFuel]
    {
    }
    !RESOURCE[Oxidizer]
    {
    }
    !MODULE[ModuleFuelTanks]
    {
    }
    MODULE
    {
        name = ModuleFuelTanks
        volume = 194392.351128
        type = Default
        basemass = -1
        utilization = 100
        utilizationTweakable = false
        TANK
        {
            name = LqdMethane
            amount = full
            maxAmount = 43.3735580953%
        }
        TANK
        {
            name = LqdOxygen
            amount = full
            maxAmount = 56.6264419047%
        }
    }
}

// Interstage -- self-contained hydrazine RCS
@PART[KCLV_CZ-10B_Interstage]:NEEDS[RealFuels]:FINAL
{
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        type = ServiceModule
        volume = 1505
        basemass = -1
        TANK
        {
            name = Hydrazine
            amount = Full
            maxAmount = 1500
        }
        TANK
        {
            name = ElectricCharge
            amount = 5000
            maxAmount = 5000
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        techLevel = 1
        origTechLevel = 1
        engineType = L
        origMass = 3
        configuration = Hydrazine
        modded = false
        CONFIG
        {
            name = Hydrazine
            thrusterPower = 2
            PROPELLANT
            {
                name = Hydrazine
                ratio = 1.0
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 300
            }
        }
    }
}

// 2nd Stage Mount -- self-contained hydrazine RCS
@PART[KCLV_CZ-10B_Stage2_Mount]:NEEDS[RealFuels]:FINAL
{
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        type = ServiceModule
        volume = 80
        basemass = -1
        TANK
        {
            name = Hydrazine
            amount = Full
            maxAmount = 80
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        techLevel = 1
        origTechLevel = 1
        engineType = L
        origMass = 1.35
        configuration = Hydrazine
        modded = false
        CONFIG
        {
            name = Hydrazine
            thrusterPower = 1
            PROPELLANT
            {
                name = Hydrazine
                ratio = 1.0
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 300
            }
        }
    }
}

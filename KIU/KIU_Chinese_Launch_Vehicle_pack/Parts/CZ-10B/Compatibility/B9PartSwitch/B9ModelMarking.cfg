// B9 only changes the S1 main-body albedo. Fuel/length stay with ConfigurableTank.
@PART[KCLV_CZ-10B_Stage1_Tank]:NEEDS[B9PartSwitch]
{
 MODULE
 {
  name = ModuleB9PartSwitch
  moduleID = ModelMarking
        switcherDescription = #KCLV_CZ-10B_Stage1_Tank_ModelMarking_desc // 型号标识
        switcherDescriptionPlural = #KCLV_CZ-10B_Stage1_Tank_ModelMarking_desc_plural // 型号标识
  affectDragCubes = false
  affectFARVoxels = false
  switchInFlight = false
  SUBTYPE
  {
   name = Marked
            title = #KCLV_CZ-10B_Stage1_Tank_ModelMarking_Marked // 显示 CZ-10B / 长征十号乙
   TEXTURE
   {
    texture = KIU/KIU_Chinese_Launch_Vehicle_pack/Parts/CZ-10B/Assets/s1_body_color
    currentTexture = s1_body_color
    baseTransform = tankBody
   }
  }
  SUBTYPE
  {
   name = Unmarked
            title = #KCLV_CZ-10B_Stage1_Tank_ModelMarking_Unmarked // 隐藏型号文字
   TEXTURE
   {
    texture = KIU/KIU_Chinese_Launch_Vehicle_pack/Parts/CZ-10B/Assets/s1_body_unmarked_color
    currentTexture = s1_body_color
    baseTransform = tankBody
   }
  }
 }
}

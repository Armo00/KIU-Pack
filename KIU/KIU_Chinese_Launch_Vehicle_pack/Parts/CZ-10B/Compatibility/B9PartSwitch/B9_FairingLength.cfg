// CZ-10B 1.0.0 migration candidate; native verification is recorded separately.
@PART[KCLV_CZ-10B_Short_Fairing|KCLV_CZ-10B_Long_Fairing]:NEEDS[B9PartSwitch]
{
    @mass = 0.9
    @cost = 1620
    @MODEL
    {
        @model = KIU/KIU_Chinese_Launch_Vehicle_pack/Parts/CZ-10B/Assets/FairingSwitch
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = FairingLength
        switcherDescription = #KCLV_CZ10B_Fairing_length
        switcherDescriptionPlural = #KCLV_CZ10B_Fairing_lengths
        switchInFlight = false
        affectDragCubes = true
        affectFARVoxels = true
        SUBTYPE
        {
            name = Short
            title = #KCLV_CZ10B_Fairing_Short
            defaultSubtypePriority = 100
            transform = Fairing_Short
            addedMass = 0
            addedCost = 0
            CoMOffset = 0, 4.9, -1.35
            CoLOffset = 0, 6.05, 0
            CoPOffset = 0, 6.05, 0
            TRANSFORM
            {
                name = FairingSepUpper
                positionOffset = 0, 0, 0
            }
        }
        SUBTYPE
        {
            name = Long
            title = #KCLV_CZ10B_Fairing_Long
            defaultSubtypePriority = 0
            transform = Fairing_Long
            addedMass = 0.475
            addedCost = 855
            CoMOffset = 0, 7.7068, -1.35
            CoLOffset = 0, 9.25, 0
            CoPOffset = 0, 9.25, 0
            TRANSFORM
            {
                name = FairingSepUpper
                positionOffset = 0, 6.4, 0
            }
        }
    }
}

@PART[KCLV_CZ-10B_Long_Fairing]:NEEDS[B9PartSwitch]
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[FairingLength]]
    {
        @SUBTYPE[Short]
        {
            @defaultSubtypePriority = 0
        }
        @SUBTYPE[Long]
        {
            @defaultSubtypePriority = 100
        }
    }
}

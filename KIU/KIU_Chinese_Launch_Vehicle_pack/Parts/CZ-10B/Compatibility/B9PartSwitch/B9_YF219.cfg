// YF-219E pump-after: stock gimbal, tracked Cardan/actuators, skinned compensation tubes. Vacuum/performance unchanged.
@PART[KCLV_YF219]:NEEDS[B9PartSwitch]:AFTER[B9PartSwitch]
{
    @mass = 1.5
    @cost = 2500
    @MODEL
    {
        @model = KIU/KIU_Chinese_Launch_Vehicle_pack/Parts/CZ-10B/Assets/YF219Switch
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = EngineMode
        switcherDescription = #KCLV_YF219_mode
        switcherDescriptionPlural = #KCLV_YF219_modes
        switchInFlight = false
        affectDragCubes = true
        affectFARVoxels = true
        SUBTYPE
        {
            name = Vacuum
            title = #KCLV_YF219_Vacuum
            transform = YF219_Nozzle_Vacuum
            transform = YF219_Body_Vacuum_Fixed
            transform = YF219_Body_Vacuum_Moving
            addedMass = 0.3
            addedCost = 100
            NODE
            {
                name = bottom
                position = 0, -6.125, 0
                size = 1
            }
            TRANSFORM
            {
                name = gimbal
                positionOffset = 0, 0, 0
            }
            TRANSFORM
            {
                name = YF219_PlumeOrigin
                positionOffset = 0, 0, 0
                scaleOffset = 1, 1, 1
            }
        }
        SUBTYPE
        {
            name = SeaLevel
            title = #KCLV_YF219_SeaLevel
            transform = YF219_Nozzle_SeaLevel
            transform = YF219_Body_SeaLevel_Fixed
            transform = YF219_Body_SeaLevel_Moving
            addedMass = 0
            addedCost = 0
            NODE
            {
                name = bottom
                position = 0, -2.600999594, 0
                size = 1
            }
            TRANSFORM
            {
                name = gimbal
                positionOffset = 2.442482819e-15, 4.706409484e-08, 1.374995589
            }
            TRANSFORM
            {
                name = YF219_PlumeOrigin
                positionOffset = -7.464252537e-15, 2.149000883, -1.766857594e-07
                scaleOffset = 0.4610401513, 0.4610401513, 0.4610401513
            }
        }
    }
    @MODULE[FXModuleLookAtConstraint]
    {
        CONSTRAINLOOKFX
        {
            targetName = YF219E_ActA_PinLower
            rotatorsName = YF219E_ActA_Cyl
        }
        CONSTRAINLOOKFX
        {
            targetName = YF219E_ActA_PinUpper
            rotatorsName = YF219E_ActA_Rod
        }
        CONSTRAINLOOKFX
        {
            targetName = YF219E_ActB_PinLower
            rotatorsName = YF219E_ActB_Cyl
        }
        CONSTRAINLOOKFX
        {
            targetName = YF219E_ActB_PinUpper
            rotatorsName = YF219E_ActB_Rod
        }
        CONSTRAINLOOKFX
        {
            targetName = YF219E_PA_CardanAim
            rotatorsName = YF219E_PA_CardanOuter
        }
    }
}

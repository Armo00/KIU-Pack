@PART[KCLV_YF219]:NEEDS[!RealFuels]
{
    MODULE
    {
        name = KIUStockEngineModeCompatibility
        engineID = YF219
        thrustScaleExponent = 2.5
        seaLevelMinThrust = 189.45360985638987
        seaLevelMaxThrust = 747.8382433774833
        seaLevelVacuumIsp = 329
        seaLevelSeaIsp = 302
        vacuumMinThrust = 201.3
        vacuumMaxThrust = 794.6
        vacuumVacuumIsp = 355
        vacuumSeaIsp = 250
    }
}

// Stock performance is applied after B9 and TS initialization. Leave B9
// mass/price and TS model scaling intact; suppress competing engine scaling.
@PART[KCLV_YF219]:NEEDS[!RealFuels,TweakScale]:FINAL
{
    @MODULE[TweakScale]
    {
        %TWEAKSCALEEXPONENTS[ModuleEngines]
        {
            %minFuelFlow = 0
            %maxFuelFlow = 0
            %minThrust = 0
            %maxThrust = 0
        }
    }
}

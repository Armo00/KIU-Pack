// Per-part KIU template selection; all thruster transforms and physics remain unchanged.
@PART[KCLV_CZ-10B_Interstage]:HAS[@MODULE[ModuleRCSFX]]:NEEDS[Waterfall]:AFTER[Waterfall]
{
    @EFFECTS
    {
        @coldGas
        {
            !MODEL_MULTI_PARTICLE,* {}
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = cz10bColdGasRCS
        engineID = basicEngine

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = rcs
            linkedTo = rcs
            thrusterTransformName = rcsThrust
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
        TEMPLATE
        {
            templateName = ColdGasRCS
            overrideParentTransform = rcsThrust
            // The core cylinder extends along local -Y. Rotate to +Z,
            // the exhaust axis of this models useZaxis=True RCS transforms.
            position = 0,0,0.005
            rotation = -90, 0, 0
            scale = 1, 3, 1
            @scale[*] *= #$/rescaleFactor$
        }
    }
}

@PART[KCLV_CZ-10B_Stage2_Mount]:HAS[@MODULE[ModuleRCSFX]]:NEEDS[Waterfall]:AFTER[Waterfall]
{
    @EFFECTS
    {
        @coldGas

// CZ-10B 1.0.2: Vacuum / supplied Stage2Temporary / current SeaLevel.
@PART[KCLV_YF219]:NEEDS[Waterfall]:AFTER[Waterfall]
{
    @EFFECTS
    {
        @running_closed
        {
            !MODEL_MULTI_PARTICLE,*
            {
            }
            !PREFAB_PARTICLE,*
            {
            }
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = YF219
        engineID = YF219
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = 0,1
        }
        CONTROLLER
        {
            name = randomshock1
            linkedTo = random
            range = 0,1
        }
        CONTROLLER
        {
            name = randomshock2
            linkedTo = random
            range = 0,1
        }
        CONTROLLER
        {
            name = randomshock3
            linkedTo = random
            range = 0,1
        }
        CONTROLLER
        {
            name = randomshock4
            linkedTo = random
            range = 0,1
        }
        TEMPLATE
        {
            name = mainPlume
            templateName = TQ-12
            overrideParentTransform = thrustTransform
            position = 0,0,0
            rotation = 0,0,0
            scale = 1.9,1.9,3.5
        }
    }
}

@PART[KCLV_YF219]:NEEDS[Waterfall,B9PartSwitch]:AFTER[Waterfall]
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[EngineMode]]
    {
        @SUBTYPE[Vacuum]
        {
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = YF219
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = mainPlume
                        templateName = TQ-12
                        overrideParentTransform = thrustTransform
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1.9,1.9,3.5
                    }
                }
            }
        }
        @SUBTYPE[Stage2Temporary]
        {
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = YF219
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = mainPlume
                        templateName = TQ-12
                        overrideParentTransform = thrustTransform
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1.058823357, 1.058823357, 1.882352634
                    }
                }
            }
        }
        @SUBTYPE[SeaLevel]
        {
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = YF219
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = mainPlume
                        templateName = TQ-12
                        overrideParentTransform = thrustTransform
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 0.9,0.9,1.6
                    }
                }
            }
        }
    }
}

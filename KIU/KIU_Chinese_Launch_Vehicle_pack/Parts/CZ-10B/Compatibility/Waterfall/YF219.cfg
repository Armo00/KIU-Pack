@PART[KCLV_YF219]:NEEDS[Waterfall]:AFTER[Waterfall]
{
    @EFFECTS
    {
        @running_closed
        {
            !MODEL_MULTI_PARTICLE,* {}
            !PREFAB_PARTICLE,* {}
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = YF219
        engineID = YF219
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = 0,1
        }
        // The shared TQ-12 template uses four independent shock modifiers.
        CONTROLLER
        {
            name = randomshock1
            linkedTo = random
            range = 0,1
        }
        CONTROLLER
        {
            name = randomshock2
            linkedTo = random
            range = 0,1
        }
        CONTROLLER
        {
            name = randomshock3
            linkedTo = random
            range = 0,1
        }
        CONTROLLER
        {
            name = randomshock4
            linkedTo = random
            range = 0,1
        }
        TEMPLATE
        {
            name = mainPlume
            templateName = TQ-12
            overrideParentTransform = thrustTransform
            position = 0,0,0
            rotation = 0,0,0
            scale = 2.25,2.25,3.5
        }
    }
}

// Waterfall applies its own template scale. Scaling the B9 plume parent alone
// moves the outlet correctly but leaves the rendered sea-level plume too wide.
@PART[KCLV_YF219]:NEEDS[Waterfall,B9PartSwitch]:AFTER[Waterfall]
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[EngineMode]]
    {
        @SUBTYPE[Vacuum]
        {
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = YF219
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = mainPlume
                        templateName = TQ-12
                        overrideParentTransform = thrustTransform
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 2.25,2.25,3.5
                    }
                }
            }
        }
        @SUBTYPE[SeaLevel]
        {
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleWaterfallFX
                    moduleID = YF219
                }
                DATA
                {
                    TEMPLATE
                    {
                        name = mainPlume
                        templateName = TQ-12
                        overrideParentTransform = thrustTransform
                        position = 0,0,0
                        rotation = 0,0,0
                        scale = 1.03734034,1.03734034,1.61364053
                    }
                }
            }
        }
    }
}

// Apply after PF's generic base patches; preserve CZ10B dimensions and avionics mass.
@PART[KCLV_CZ-10B_Payload_Adapter_PF]:NEEDS[ProceduralFairings]:AFTER[ProceduralFairings]
{
 %tags = CZ10B CZ10B Long March 长征 十号 载荷 支架 fairing procedural payload avionics
 @mass = 1.5
 @bulkheadProfiles = size4
 @stackSymmetry = 1
 @MODULE[ProceduralFairingBase]
 {
  @baseSize = 5.2
  @minSize = 5.2
  @maxSize = 5.2
  @sideThickness = 0.01
  // Smooth silhouette for the CZ10 PF side; 48 segments per half.
  %circleSegments = 96
  @specificMass = 0, 0, 0, 1.5
  @costPerTonne = 0
  !UPGRADES {}
 }
 @MODULE[KzNodeNumberTweaker]
 {
  @numNodes = 2
  @maxNumber = 2
  @radius = 2.6
 }
}

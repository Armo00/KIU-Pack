// CZ-10B opt-in; requires the KIU-maintained PF 6.8.0.0 collision build.
// User authorized live publication on 2026-10-23; native validation pending.
// No visible-mesh subdivision, curve, texture, mass or decoupling settings change.
// An official PF build ignores these fields: verify actual collider counts in game.
@PART[KCLV_CZ-10B_Procedural_Fairing]:NEEDS[ProceduralFairings]:AFTER[ProceduralFairings]
{
    @MODULE[ProceduralFairingSide]
    {
        %useSimpleColliders = true
        %simpleColliderSectors = 6
        %simpleColliderNosePanels = 4
        %simpleColliderClearance = 0.002
        %simpleColliderSeamGap = 0.01
        %simpleColliderMaxExpansionRatio = 0.06
    }
}

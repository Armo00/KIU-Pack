// Modified 2026-09-19
// CZ-10B -- RemoteTech support.
//
// Every part that carries a ModuleCommand is listed here: the 1st stage tank
// (which doubles as the flight avionics) and the two payload adapters. They keep
// their stock ModuleDataTransmitter when RemoteTech is absent, so there is no
// separate CommNet fallback file to maintain.
//
// Values follow Compatibility/RemoteTech/NTCP-RT2.cfg, the pack's standing
// treatment for an avionics part: one active omni antenna at 5000 km, no dish.

@PART[KCLV_CZ-10B_Stage1_Tank|KCLV_CZ-10B_Payload_Adapter|KCLV_CZ-10B_Payload_Adapter_PF]:NEEDS[RemoteTech]
{
    !MODULE[ModuleDataTransmitter] {}
    %MODULE[ModuleSPU] {}
    MODULE
    {
        name = ModuleRTAntenna
        IsRTActive = True
        Mode0OmniRange = 0
        Mode1OmniRange = 5000000   // 5000km
        EnergyCost = 0.001         // 3.6w
        TRANSMITTER
        {
            PacketInterval = 1.0
            PacketSize = 0.512
            PacketResourceCost = 0.025
        }
    }
}

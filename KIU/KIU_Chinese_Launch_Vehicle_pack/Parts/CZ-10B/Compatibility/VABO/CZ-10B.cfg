// Modified 2026-09-19
// CZ-10B -- VAB Organizer sorting.
//
// Two blocks, matching the split KCLV keeps in Compatibility/VABO/:
//   * the bulkhead profile block belongs in bulkheadProfiles_tweak.cfg
//   * the subcategory block belongs in Subcategory_tweak.cfg
// They are kept together here while CZ-10B is standalone.

// ---------------------------------------------------------------- bulkheads
// Surface-attached parts carry no stack diameter. Both of these attach to a
// tank's skin and have no node of their own.
@PART[KCLV_CZ-10B_Grid_Fin|KCLV_CZ-10B_Recovery_Hook]:NEEDS[VABOrganizer]
{
    %bulkheadProfiles = srf
}

// 5 m stack parts. Every CZ-10B part ships at rescaleFactor 1 and the pack's
// Common/Extra patch forces 1 as well, so unlike the older KCLV vehicles there
// is no 0.6-scaled stock branch -- the real 5 m profile, KSP's native size4, is
// correct both with and without RealFuels.
@PART[KCLV_CZ-10B_Stage1_Engine_Bay|KCLV_CZ-10B_Stage1_Tank|KCLV_CZ-10B_Stage2_Tank|KCLV_CZ-10B_Stage2_Mount|KCLV_CZ-10B_Interstage|KCLV_CZ-10B_Short_Fairing|KCLV_CZ-10B_Payload_Adapter|KCLV_CZ-10B_Payload_Adapter_PF|KCLV_CZ-10B_Launch_Erector]:NEEDS[VABOrganizer]
{
    %bulkheadProfiles = size4
}

// ------------------------------------------------------------- subcategories
// Propellant tanks
@PART[KCLV_CZ-10B_Stage1_Tank|KCLV_CZ-10B_Stage2_Tank]:NEEDS[VABOrganizer]
{
    %VABORGANIZER
    {
        %organizerSubcategory = lfo
    }
}

// Engine bays and mounts
@PART[KCLV_CZ-10B_Stage1_Engine_Bay|KCLV_CZ-10B_Stage2_Mount]:NEEDS[VABOrganizer]
{
    %VABORGANIZER
    {
        %organizerSubcategory = engineMount
    }
}

// Interstage
@PART[KCLV_CZ-10B_Interstage]:NEEDS[VABOrganizer]
{
    %VABORGANIZER
    {
        %organizerSubcategory = interstages
    }
}

// Fairing
@PART[KCLV_CZ-10B_Short_Fairing]:NEEDS[VABOrganizer]
{
    %VABORGANIZER
    {
        %organizerSubcategory = fairings
    }
}

// Payload adapters
@PART[KCLV_CZ-10B_Payload_Adapter|KCLV_CZ-10B_Payload_Adapter_PF]:NEEDS[VABOrganizer]
{
    %VABORGANIZER
    {
        %organizerSubcategory = payload_adapters
    }
}

// Grid fin -- same home as the Zhuque-3 grid fin.
@PART[KCLV_CZ-10B_Grid_Fin]:NEEDS[VABOrganizer]
{
    %VABORGANIZER
    {
        %organizerSubcategory = deployableControlSurfaces
    }
}

// Recovery hook -- filed with the booster recovery gear, where the pack already
// keeps the Zhuque-3 landing leg. Move it if you would rather see it under the
// part's own Utility category.
@PART[KCLV_CZ-10B_Recovery_Hook]:NEEDS[VABOrganizer]
{
    %VABORGANIZER
    {
        %organizerSubcategory = legs
    }
}

// Ground equipment
@PART[KCLV_CZ-10B_Launch_Erector]:NEEDS[VABOrganizer]
{
    %VABORGANIZER
    {
        %organizerSubcategory = launch_pads
    }
}

        #KCLV_CZ-10B_Stage2_Tank_description = 长征十号系列运载火箭的二子级燃料箱。可在编辑器中以0.5米为单位加装延长段，用于匹配不同构型。
        #KCLV_CZ-10B_Stage2_Tank_tags = KCLV CZ10B LM10 2nd stage fueltank 长征十号 二子级 燃料箱 甲烷

        // ********** Part: KCLV_CZ-10B_Stage2_Mount

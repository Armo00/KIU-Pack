        #KCLV_CZ-10B_Stage2_Mount_description = 二子级发动机支架，集成飞控航电、SAS、蓄电池、反作用轮和 RCS。单发布局适配 YF-219；双发、三发与四发保留通用安装位置。
        #KCLV_CZ-10B_Stage2_Mount_tags = KCLV CZ10B LM10 2nd stage engine mount rcs avionics sas 长征十号 二子级 发动机 安装座 航电 电池

        // ********** Part: KCLV_CZ-10B_Interstage

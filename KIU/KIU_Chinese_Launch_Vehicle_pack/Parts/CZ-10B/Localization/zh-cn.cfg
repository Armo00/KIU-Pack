        // ------------------CZ-10B--------------------------
        // ********** Part: KCLV_CZ-10B_Stage1_Engine_Bay
        #KCLV_CZ-10B_Stage1_Engine_Bay_title = CZ-10系列一子级引擎舱
        #KCLV_CZ-10B_Stage1_Engine_Bay_description = 5米引擎舱，提供七发、九发安装布局与六档发动机下移高度。七发布局适配现有 KIU YF-100，九发布局适配 YF-219E 海平面型；装配时请保留对应发动机的安装朝向。发动机作为独立零件安装。
        #KCLV_CZ-10B_Stage1_Engine_Bay_tags = KCLV CZ10B LM10 1st stage engine bay 长征十号 一子级 引擎舱 尾段 五米

        // ********** Part: KCLV_CZ-10B_Stage1_Tank
        #KCLV_CZ-10B_Stage1_Tank_title = CZ-10系列一子级燃料箱
        #KCLV_CZ-10B_Stage1_Tank_description = 长征十号系列运载火箭的一子级燃料箱，集成飞控航电与 SAS。可在编辑器中以1米为单位加装延长段，用于匹配不同构型，出厂状态装一节。
        #KCLV_CZ-10B_Stage1_Tank_tags = KCLV CZ10B LM10 1st stage fueltank avionics 长征十号 一子级 燃料箱 航电 煤油


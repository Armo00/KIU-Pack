        #KCLV_CZ-10B_Stage1_Engine_Bay_description = The 5 m engine bay of the Long March 10 series. Choose a seven engine (1 centre + 6) or nine engine (1 centre + 8) layout with B9 PartSwitch before fitting the engines. Main engines are supplied separately.

// Kerbal Konstructs static asset definition for the KIU Landspace Jiuquan Launch Tower.
//
// This folder holds no PART definition - only this KK static and the meshes/textures it uses
// (the tower mesh is referenced below via `mesh =`).
//
// NOTE: Kerbal Konstructs reads title/description as raw strings (ConfigUtil.ReadCFGNode, no
// Localizer call anywhere in KK) and shows them verbatim, so these fields MUST stay English
// literals. Writing a #key here would display the literal "#..." text in the KK statics list.

STATIC:NEEDS[KerbalKonstructs]
{
    name = KCLV_Landspace_Jiuquan_Launch_Tower_KK
    title = Landspace Jiuquan Launch Tower
    author = KIU
    mesh = Landspace_Jiuquan_Launch_Tower.mu
    module = Part
    static = true
    category = Launchpads
    cost = 50000
    manufacturer = Landspace
    description = Landspace launch tower at Jiuquan Satellite Launch Center. Provides umbilical connections and launch support for the Zhuque-3 launch vehicle.
    keepConvex = False
    isSquad = False
    isHidden = False
    DefaultLaunchSiteLength = 220.0
    DefaultLaunchSiteWidth = 220.0
    DefaultLaunchPadTransform = Node_2
    MODULE
    {
        namespace = KerbalKonstructs
        name = PadSmoke
        smokeReceiverName = SmokeReceiver
        smokeEmittersNames = SmokeTransform
    }
}

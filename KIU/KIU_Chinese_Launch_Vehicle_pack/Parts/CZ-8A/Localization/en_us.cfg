        #KCLV_CZ8A_Stage_2_title = Long March 8A 3.35 m Cryogenic Second Stage Tank
        #KCLV_CZ8A_Stage_2_description = A 3.35 m cryogenic upper-stage tank for the separate twin-engine mount or your own propulsion assembly. Uses LiquidFuel and Oxidizer in stock KSP, or liquid hydrogen and liquid oxygen with RealFuels. The attitude-control system is carried by the separate mount.
        #KCLV_CZ8A_Stage_2_tags = KCLV KIU CZ8A LM8A CZ335 3.35 Long March second upper cryogenic hydrolox tank
        #KCLV_CZ8A_Engine_Mount_title = Long March 8A 3.35 m Twin Engine Mount with RCS
        #KCLV_CZ8A_Engine_Mount_description = An independent twin YF-75 mounting frame with twelve RCS nozzles and attitude-control propellant. Attach engines to the two offset nodes and rotate the second engine 180 degrees around its own axis to align the feed lines. The central downward node accepts the enclosing interstage.
        #KCLV_CZ8A_Engine_Mount_tags = KCLV KIU CZ8A LM8A CZ335 3.35 Long March second engine mount twin YF75 RCS
        #KCLV_CZ8A_Interstage_title = Long March 8A 3.35 m First/Second Stage Interstage
        #KCLV_CZ8A_Interstage_description = A straight 3.35 m interstage enclosing the upper-stage engine mount and engines. Connect its upper node to the mount's central downward node. Staging releases the upper assembly; fuel crossfeed is disabled by default.

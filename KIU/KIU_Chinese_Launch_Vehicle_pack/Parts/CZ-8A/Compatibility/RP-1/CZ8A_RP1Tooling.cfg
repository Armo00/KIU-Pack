// Dimensions follow the delivered model. Multipliers follow existing KCLV tooling.
// Fixed dry mass / costs are gameplay estimates inherited from the CZ335 prototype.
@PART[KCLV_CZ8A_Stage_2]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    %MODULE[ModuleToolingDiamLen]
    {
        %toolingName = Tool Tank
        %toolingType = Tank-Sep-Al2
        %untooledMultiplier = 0.08
        %finalToolingCostMultiplier = 0.35
        %costMultiplierDL = 5
        %partDiameter = 3.35
        %partLength = 8.835
    }
}

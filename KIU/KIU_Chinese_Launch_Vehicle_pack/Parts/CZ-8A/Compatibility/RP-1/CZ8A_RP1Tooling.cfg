        %finalToolingCostMultiplier = 0.0625
        %costMultiplierDL = 3.5
        %partDiameter = 3.35
        %partLength = 1.302713
    }
}
@PART[KCLV_CZ8A_Interstage]:NEEDS[RP-0]:BEFORE[zzzRP-0]

// CZ8A: CZ7 paint settings; Matte affects opaque hardware only.
// Default restores the original material. Marking Cutoff and tint never change.

@PART[KCLV_CZ8A_Stage_2]:NEEDS[B9PartSwitch]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = SurfaceGloss
        switcherDescription = #KCLV_CZ8A_Finish
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = false
        SUBTYPE
        {
            name = Default
            title = #KCLV_CZ8A_Finish_Default
            defaultSubtypePriority = 1
        }
        SUBTYPE
        {
            name = Matte
            title = #KCLV_CZ8A_Finish_Matte
            MATERIAL
            {
                transform = TankShell
                transform = Tank_013
                transform = Tank_095
                transform = Tank_096
                transform = Tank_101
                transform = Tank_102
                transform = Tank_103
                transform = Tank_104
                transform = Tank_105
                transform = Tank_106
                transform = Tank_107
                FLOAT
                {
                    shaderProperty = _Shininess
                    value = 0.01
                }
                COLOR
                {
                    shaderProperty = _SpecColor
                    color = 0.02,0.02,0.02,1
                }
            }
            MATERIAL
            {
                transform = Tank_007
                transform = Tank_108
                FLOAT
                {
                    shaderProperty = _Shininess
                    value = 0.01
                }
                TEXTURE
                {
                    shaderProperty = _SpecMap
                    texture = KIU/Common/KIU_Common_texture/Shared_MatteSpec.v1.0.0
                    isNormalMap = false
                }
            }
        }
    }
}


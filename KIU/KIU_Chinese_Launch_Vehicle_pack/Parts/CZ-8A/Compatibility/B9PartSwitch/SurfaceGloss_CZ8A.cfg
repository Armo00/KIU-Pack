// Finish is independent of CZ8ALivery; the mount remains a separate Part.
// B9 applies properties only to materials which expose them. Ordinary specular
// uses _SpecColor, while Mapped specular needs a zero RGB/alpha _SpecMap.
// Default has no overrides so B9 restores each material's captured original values.
@PART[KCLV_CZ8A_Stage_2|KCLV_CZ8A_Engine_Mount|KCLV_CZ8A_Interstage]:NEEDS[B9PartSwitch]
{
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = SurfaceGloss
        switcherDescription = #KCLV_CZ8A_Finish
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = false
        SUBTYPE
        {
            name = Default
            title = #KCLV_CZ8A_Finish_Default
            defaultSubtypePriority = 1
        }
        SUBTYPE
        {
            name = Matte
            title = #KCLV_CZ8A_Finish_Matte
            MATERIAL
            {
                COLOR
                {
                    shaderProperty = _SpecColor
                    color = 0.02,0.02,0.02,1
                }
                FLOAT
                {
                    shaderProperty = _Shininess
                    value = 0.01
                }
                TEXTURE
                {
                    shaderProperty = _SpecMap
                    texture = KIU/Common/KIU_Common_texture/Shared_MatteSpec.v1.0.0
                    isNormalMap = false
                }
            }
        }
    }
}

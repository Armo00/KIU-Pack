// The twelve original RCS transforms remain on the independent engine mount.
// Reuse KIU/Common/WaterfallTemplate/RCSTemplate.cfg; there are no separation motors.
@PART[KCLV_CZ8A_Engine_Mount]:NEEDS[Waterfall]:AFTER[Waterfall]
{
    @EFFECTS
    {
        @running
        {
            !MODEL_MULTI_PARTICLE,* {}
        }
    }
    %MODULE[ModuleWaterfallFX]
    {
        %moduleID = CZ8A_RCS
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = rcs
            linkedTo = rcs
        }
        TEMPLATE
        {
            templateName = NewRCS
            overrideParentTransform = RCS
            position = 0,0,0
            rotation = 0,0,180
            scale = 1,3,1
            @scale[*] *= #$/rescaleFactor$
        }
    }
}

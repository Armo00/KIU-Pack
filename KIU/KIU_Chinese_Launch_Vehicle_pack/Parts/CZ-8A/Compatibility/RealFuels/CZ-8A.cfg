// Volume scales by (3.35/3)^2 at unchanged axial length.
// RCS propellant stays with the independent mount. No fuel-switching B9 module.
@PART[KCLV_CZ8A_Stage_2]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    @mass = 2.063889
    !RESOURCE,* {}
    !MODULE[ModuleFuelTanks],* {}
    MODULE
    {
        name = ModuleFuelTanks
        type = ServiceModule
        volume = 71402.733536
        basemass = -1
        TANK
        {
            name = LqdHydrogen
            amount = Full
            maxAmount = 54194.674755
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 17208.058781
        }
    }
}
@PART[KCLV_CZ8A_Engine_Mount]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    !RESOURCE,* {}
    RESOURCE
    {
        name = Hydrazine
        amount = 100
        maxAmount = 100
    }
    @MODULE[ModuleRCSFX]
    {
        @resourceName = Hydrazine
        @thrusterPower = 0.8
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 290
            key = 1 180
            key = 4 0.001
        }
    }
}

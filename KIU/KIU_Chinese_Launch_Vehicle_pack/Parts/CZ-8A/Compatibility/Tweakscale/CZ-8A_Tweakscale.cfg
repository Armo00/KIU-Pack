// These parts are physically 3.35 m both with and without RealFuels.
// KCLVStack is already defined in KCLV's Tweakscale_KCLV_Setup.cfg.
@PART[KCLV_CZ8A_Stage_2|KCLV_CZ8A_Engine_Mount|KCLV_CZ8A_Interstage]:NEEDS[TweakScale]
{
    %MODULE[TweakScale]
    {
        %type = KCLVStack
        %defaultScale = 3.35
    }
}

        #KCLV_YZ2_title = Yuanzheng-2 Upper Stage (3.8 m)
        #KCLV_YZ2_description = A 3.8 m Yuanzheng-2 stage body with four spherical tanks, payload mounts and four six-DOF RCS pods. Attach one existing YF-50E at each engine1/engine2 node as a provisional YF-50D substitute. Body dry mass is 1.1 t; with two default 50 kg engines the stage is 1.2 t dry and 7.4 t wet with 6.2 t propellant. RF retains net volume for 7.2 t of UDMH/NTO, but initially allocates only the volume needed for 6.2 t and fills those allocations completely; the remainder is unallocated. Maximum wet mass after reallocating is 8.4 t. RCS defaults to shared UDMH/NTO, with optional MMH/NTO or Hydrazine requiring a separate RF allocation. RCS selection does not change main-engine propellant.
        #KCLV_YZ2_tags = Yuanzheng YZ2 YZ-2 upperstage probe RCS satellite payload

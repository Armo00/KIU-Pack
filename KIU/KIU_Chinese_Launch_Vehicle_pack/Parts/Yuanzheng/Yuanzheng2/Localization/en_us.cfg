        #KCLV_YZ2_title = Yuanzheng-2 Upper Stage (3.8 m)
        #KCLV_YZ2_description = A 3.8 m upper stage with four spherical propellant tanks, four payload mounting points and four RCS pods for attitude and translation control. Attach two existing YF-50E engines to the engine1/engine2 nodes as temporary substitutes for YF-50D. With two default 50 kg YF-50E engines, the assembled stage is 1.8 t dry and 8.0 t at the default 6.2 t propellant load, excluding payload and external adapters. RealFuels allows up to 7.2 t of shared main/RCS propellant, giving a 9.0 t maximum stage mass. Engine performance and restart limits remain those of the selected YF-50E configuration.
        #KCLV_YZ2_tags = Yuanzheng YZ2 YZ-2 upperstage probe RCS satellite payload

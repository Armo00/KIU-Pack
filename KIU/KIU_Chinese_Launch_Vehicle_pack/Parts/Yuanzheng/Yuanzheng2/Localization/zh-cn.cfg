        #KCLV_YZ2_title = 远征二号上面级（3.8 米）
        #KCLV_YZ2_description = 直径 3.8 米的远征二号上面级本体，带四个球形燃料箱、载荷挂点和四组可控制六自由度的 RCS。engine1/engine2 各安装一台现有 YF-50E，暂代 YF-50D。本体干重 1.1 吨；两台默认 50 kg 发动机装齐后干重 1.2 吨，默认推进剂 6.2 吨，湿重 7.4 吨。RF 总净容积保留到 UDMH/NTO 配比下 7.2 吨容量；默认仅分配 6.2 吨所需容积并加满，余量未分配，重新分配后最大湿重 8.4 吨。RCS 默认共用 UDMH/NTO，也可选 MMH/NTO 或 Hydrazine；替代燃料须在 RF 中另行分配，主发动机燃料不随 RCS 切换。
        #KCLV_YZ2_tags = 远征 二号 上面级 探测器 姿控 卫星 载荷 Yuanzheng YZ2 YZ-2

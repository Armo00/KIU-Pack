        #KCLV_YZ2_title = 远征二号上面级（3.8 米）
        #KCLV_YZ2_description = 直径 3.8 米的上面级本体，带四个球形燃料箱、四个载荷安装点，以及支持姿态和三轴平移控制的四组 RCS。请在 engine1/engine2 节点各安装一台现有 YF-50E，暂时代替 YF-50D。搭配两台默认 50 kg 的 YF-50E 时，整级干重 1.8 吨，默认装载 6.2 吨推进剂时湿重 8 吨，不含载荷与外接适配器。RF 下主发动机与 RCS 共用推进剂，最多可装 7.2 吨，整级最大湿重 9 吨。发动机性能和重启次数仍取决于所选 YF-50E 配置。

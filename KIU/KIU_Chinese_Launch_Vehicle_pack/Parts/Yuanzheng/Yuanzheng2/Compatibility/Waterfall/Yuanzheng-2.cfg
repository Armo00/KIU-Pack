// Reuse the same KIU NewRCS template and axis convention as CZ-10B's S2 mount.
@PART[KCLV_Yuanzheng2]:NEEDS[Waterfall]:AFTER[Waterfall]
{
    @EFFECTS
    {
        @rcs
        {
            !MODEL_MULTI_PARTICLE,* {}
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = YZ2_RCS
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = rcs
            linkedTo = rcs
            thrusterTransformName = rcsThrust
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1, 1
        }
        TEMPLATE
        {
            templateName = NewRCS
            overrideParentTransform = rcsThrust
            // Template extends along -Y; the exported nozzles exhaust along +Z.
            position = 0, 0, 0.002
            rotation = -90, 0, 0
            scale = 0.32, 0.45, 0.32
        }
    }
}

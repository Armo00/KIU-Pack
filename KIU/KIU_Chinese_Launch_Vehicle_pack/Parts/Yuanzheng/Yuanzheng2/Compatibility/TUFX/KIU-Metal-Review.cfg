// Optional review profiles. Do not globally replace another user's TUFX profile.
// Reflection probes are a KSP graphics setting, not a TUFX post-process effect.
TUFX_PROFILE:NEEDS[TUFX]
{
    name = KIU-Metal-Review-Editor
    hdr = True
    Antialiasing
    {
        Mode = FastApproximateAntialiasing
    }
    SecondaryCameraAntialiasing
    {
        Mode = None
    }
    EFFECT
    {
        name = AmbientOcclusion
        Intensity = 0.2
    }
    EFFECT
    {
        name = Bloom
        Intensity = 0.3
        Threshold = 1.15
        SoftKnee = 0.5
        Diffusion = 4
        FastMode = True
    }
    EFFECT
    {
        name = ColorGrading
        GradingMode = HighDefinitionRange
        Tonemapper = Neutral
        PostExposure = 0.25
        Contrast = 0
        Saturation = 0
    }
}

// Main propellants match the EXISTING default KCLV_YF50E: UDMH/NTO = 0.46/0.54 by volume.
// CRP densities (t/L): UDMH .000791, NTO .00145.
// Default main/RCS pool: 6200 kg in FULL allocated tanks. Remaining volume is
// UNALLOCATED, following CZ-7 S1; reallocate UDMH/NTO to 46%/54% for 7200 kg.
// Optional RCS MMH/NTO or Hydrazine requires allocating its fuel in the RF GUI.
// RF owns dry mass: 1.1 t at 6278.011265542 L, scaling cubically with TweakScale.
// Per-resource shell masses are included in that stage-body budget, not added twice.
// NET liquid capacity is 6278.01 L. Four 1.53 m spherical tank envelopes
// enclose 7413.68 L in the actual mesh. Two tanks per propellant: NTO limits
// usable space. An 8 mm radial envelope/wall budget, 2% internal displacement
// and 3% ullage leaves 3414.33 L for NTO against 3390.13 L required at 7.2 t.
// These are game-model interior budgets, not verified pressure-vessel sizing.
// The earlier 20 mm / 5% / 5% allowance only supports the default 6.2 t load.
@PART[KCLV_Yuanzheng2]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    !RESOURCE[LiquidFuel] {}
    !RESOURCE[Oxidizer] {}
    !RESOURCE[MonoPropellant] {}
    !MODULE[ModuleFuelTanks],* {}
    MODULE
    {
        name = ModuleFuelTanks
        type = ServiceModule
        volume = 6278.011265542
        basemass = 0.00017521472222223444 * volume
        utilization = 100
        utilizationTweakable = false
        UNMANAGED_RESOURCE
        {
            name = ElectricCharge
            amount = 6000
            maxAmount = 6000
        }
        TANK
        {
            name = UDMH
            amount = Full
            maxAmount = 39.61111111111111%
            mass = 0
            // Explicit thermal geometry; avoid RF's generic 0.1 m wall fallback.
            wallThickness = 0.003
            insulationThickness = 0.005
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 46.5%
            mass = 0
            wallThickness = 0.003
            insulationThickness = 0.005
        }
        // Optional RCS fuels are available for allocation, but not prefilled.
        TANK
        {
            name = MMH
            amount = 0
            maxAmount = 0
            mass = 0
            wallThickness = 0.003
            insulationThickness = 0.005
        }
        TANK
        {
            name = Hydrazine
            amount = 0
            maxAmount = 0
            mass = 0
            wallThickness = 0.003
            insulationThickness = 0.005
        }
        // Battery stays unmanaged; its structural mass is already in the body budget.
        TANK
        {
            name = ElectricCharge
            mass = 0
            amount = 0
            maxAmount = 0
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCSFX
        useWeakType = false
        // MFT owns body mass; do not let an RCS config multiply it again.
        origMass = -1
        techLevel = -1
        origTechLevel = -1
        configuration = UDMH/NTO
        modded = false
        CONFIG
        {
            name = UDMH/NTO
            thrusterPower = 0.1
            PROPELLANT
            {
                name = UDMH
                ratio = 0.46
                resourceFlowMode = NO_FLOW
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.54
                resourceFlowMode = NO_FLOW
            }
            atmosphereCurve
            {
                key = 0 290
                key = 1 100
            }
        }
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.1
            PROPELLANT
            {
                name = MMH
                ratio = 0.499
                resourceFlowMode = NO_FLOW
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.501
                resourceFlowMode = NO_FLOW
            }
            atmosphereCurve
            {
                key = 0 310
                key = 1 110
            }
        }
        CONFIG
        {
            name = Hydrazine
            thrusterPower = 0.08
            PROPELLANT
            {
                name = Hydrazine
                ratio = 1
                resourceFlowMode = NO_FLOW
            }
            atmosphereCurve
            {
                key = 0 240
                key = 1 85
            }
        }
    }
    @MODULE[ModuleRCSFX]
    {
        !resourceName = DELETE
        !PROPELLANT,* {}
        PROPELLANT
        {
            name = UDMH
            ratio = 0.46
            resourceFlowMode = NO_FLOW
        }
        PROPELLANT
        {
            name = NTO
            ratio = 0.54
            resourceFlowMode = NO_FLOW
        }
        @thrusterPower = 0.1
        @atmosphereCurve
        {
            @key,0 = 0 290
            @key,1 = 1 100
        }
    }
}

// Optional mission setup for the existing external KCLV_YF50E. No new engine
// model and no change to its default or Advanced configuration / other crafts.
// Provisional gameplay adaptation, not measured YF-50D engine data.
// Retains the agreed 50 kg per engine and shared UDMH/NTO pool; native RF
// ullage and ignition-resource checks remain active on every restart.
@PART[KCLV_YF50E]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    @MODULE[ModuleEngineConfigs]
    {
        CONFIG
        {
            name = YF-50E_YZ2
            // RF's own tooltip path reads description literally. Keep it readable
            // in either language; detailed guidance lives in the localized Part.
            description = YZ2 mission / 远征二号任务: 20 ignitions / 20次点火, 2–6.5 kN, 50 kg, UDMH/NTO 0.46/0.54. Settle with RCS before ignition / 点火前用RCS沉底. Provisional gameplay setup / 临时游戏适配.
            minThrust = 2
            maxThrust = 6.5
            heatProduction = 100
            massMult = 1.00
            ullage = True
            pressureFed = False
            ignitions = 20
            PROPELLANT
            {
                name = UDMH
                ratio = 0.46
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.54
            }
            atmosphereCurve
            {
                key = 0 315.5
                key = 1 250
            }
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1.0
            }
        }
    }
}

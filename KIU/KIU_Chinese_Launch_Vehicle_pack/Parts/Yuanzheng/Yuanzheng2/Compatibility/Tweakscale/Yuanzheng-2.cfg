// Real diameter is 3.8 m in BOTH stock and RealFuels, unlike the older YZ-3.
// Reuse the pack's KCLVStack scale type; never replace its global definition.
// The matching bracket uses the same nominal stage diameter, not its flange OD.
@PART[KCLV_Yuanzheng2|KCLV_Yuanzheng2_PayloadBracket]:NEEDS[TweakScale]:AFTER[TweakScale]
{
    // Restore static attachment-node coordinates after /L flight-save loading.
    // The optional KIU adapter uses /L's node scaler without moving Parts.
    %KIURestoreScaledNodes = true
    %MODULE[TweakScale]
    {
        %type = KCLVStack
        %defaultScale = 3.8
    }
}

// Original TweakScale /L otherwise removes itself from every RF + B9 Part.
// ConfigurableTank.dll's optional Harmony adapter verifies ALL B9 switches are
// visual-only before honoring this explicit opt-in. RF continues to own fuel.
// This does not add a ConfigurableTank module or disable TweakScale exponents.
@PART[KCLV_Yuanzheng2]:NEEDS[TweakScale,RealFuels,B9PartSwitch]:AFTER[TweakScale]
{
    %KIUVisualB9RFCompatibility = true
}

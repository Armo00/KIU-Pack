PART
{
    name = KCLV_Yuanzheng2
    module = Part
    author = KIU
    rescaleFactor = 1

    MODEL
    {
        model = KIU/KIU_Chinese_Launch_Vehicle_pack/Parts/Yuanzheng/Yuanzheng2/Assets/Yuanzheng2
        texture = YZ2_Normal, KIU/Common/KIU_Common_texture/Shared_CrumpledFoil_NormalAG.v1.0.0
        texture = YZ2_HardwareNormal, KIU/Common/KIU_Common_texture/Shared_FlatNormal.v3.5.2
    }

    // Unity/KSP Y up, metres. Four payload hardpoints plus a central stack node.
    node_stack_top = 0, 0.075, 0, 0, 1, 0, 2
    node_stack_bottom = 0, -1.54, 0, 0, -1, 0, 3
    node_stack_payload1 = -0.86, 0.075, 0, 0, 1, 0, 0
    node_stack_payload2 = 0.86, 0.075, 0, 0, 1, 0, 0
    node_stack_payload3 = 0, 0.075, -0.86, 0, 1, 0, 0
    node_stack_payload4 = 0, 0.075, 0.86, 0, 1, 0, 0
    node_stack_engine1 = -0.42, -1.355, 0, 0, -1, 0, 0
    node_stack_engine2 = 0.42, -1.355, 0, 0, -1, 0, 0
    attachRules = 1,0,1,1,0
    stackSymmetry = 1
    fuelCrossFeed = True

    TechRequired = precisionPropulsion
    entryCost = 18000
    cost = 9200
    category = Pods
    subcategory = 0
    title = #KCLV_YZ2_title
    manufacturer = #CASC
    description = #KCLV_YZ2_description
    tags = #KCLV_YZ2_tags
    vesselType = Probe
    bulkheadProfiles = size3

    // Stage totals with TWO default KCLV_YF50E (0.05 t each), no payload/adapter:
    // dry 1.1 + 0.1 = 1.2 t; wet 1.2 + 6.12 main + 0.08 RCS = 7.4 t.
    // Main/RCS split and RCS thrust are gameplay assumptions, not flight data.
    mass = 1.1
    CoMOffset = 0, -0.55, 0
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 6
    breakingForce = 300
    breakingTorque = 300
    maxTemp = 1500
    skinMaxTemp = 1700
    emissiveConstant = 0.8

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        hasHibernation = True
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.025
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        packetInterval = 0.35
        packetSize = 2
        packetResourceCost = 18
        requiredResource = ElectricCharge
        antennaPower = 5000000
        antennaCombinable = True
    }
    // Attitude control is provided by the physical RCS pods, with no hidden wheel.
    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = False
        thrusterTransformName = rcsThrust
        useZaxis = True
        thrusterPower = 0.1
        resourceName = MonoPropellant
        resourceFlowMode = NO_FLOW
        runningEffectName = rcs
        enablePitch = True
        enableYaw = True
        enableRoll = True
        enableX = True
        enableY = True
        enableZ = True
        atmosphereCurve
        {
            key = 0 240
            key = 1 100
            key = 4 0.001
        }
    }
    EFFECTS
    {
        rcs
        {
            AUDIO_MULTI_POOL
            {
                channel = Ship
                transformName = rcsThrust
                clip = sound_rocket_mini
                volume = 0.0 0.0
                volume = 1.0 0.1
                pitch = 0.0 0.75
                pitch = 1.0 1.5
                loop = true
            }
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/Monoprop_small
                transformName = rcsThrust
                emission = 0.0 0.0
                emission = 0.1 0.0
                emission = 1.0 0.15
                speed = 0.0 0.5
                speed = 1.0 0.5
                localRotation = 0, 0, 0
            }
        }
    }
    RESOURCE
    {
        name = LiquidFuel
        amount = 550.8
        maxAmount = 550.8
    }
    RESOURCE
    {
        name = Oxidizer
        amount = 673.2
        maxAmount = 673.2
    }
    RESOURCE
    {
        name = MonoPropellant
        amount = 20
        maxAmount = 20
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 6000
        maxAmount = 6000
    }
}

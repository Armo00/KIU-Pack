PART
{
    name = KCLV_Yuanzheng2_PayloadBracket
    module = Part
    author = KIU
    rescaleFactor = 1

    MODEL
    {
        model = KIU/KIU_Chinese_Launch_Vehicle_pack/Parts/Yuanzheng/Yuanzheng2/Assets/Yuanzheng2_PayloadBracket
        texture = YZ2_HardwareNormal, KIU/Common/KIU_Common_texture/Shared_FlatNormal.v3.5.2
    }

    // Lower flange rests directly on the YZ2 deck at its central top node.
    node_stack_bottom = 0, 0, 0, 0, -1, 0, 2
    node_stack_top = 0, 0.72, 0, 0, 1, 0, 2
    attachRules = 1,0,1,1,0
    fuelCrossFeed = False
    TechRequired = precisionPropulsion
    entryCost = 4000
    cost = 800
    category = Payload
    subcategory = 0
    title = #KCLV_YZ2_PayloadBracket_title
    manufacturer = #CASC
    description = #KCLV_YZ2_PayloadBracket_description
    tags = #KCLV_YZ2_PayloadBracket_tags
    bulkheadProfiles = size3, size2

    // Separate 200 kg accessory; excluded from the stage's 1.2 t dry mass.
    mass = 0.2
    CoMOffset = 0, 0.32, 0
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 9
    breakingForce = 300
    breakingTorque = 300
    maxTemp = 1500
    skinMaxTemp = 1700

    MODULE
    {
        name = ModuleDecouple
        ejectionForce = 5
        explosiveNodeID = top
        isOmniDecoupler = false
        menuName = #KCLV_YZ2_ReleasePayload
        stagingEnabled = False
        stagingToggleEnabledEditor = True
    }
    // Stage the lower interface by default; top remains a separate PAW/action.
    // Enabling both modules for staging releases both ends on the same stage.
    MODULE
    {
        name = ModuleDecouple
        ejectionForce = 5
        explosiveNodeID = bottom
        isOmniDecoupler = false
        menuName = #KCLV_YZ2_ReleaseBracket
        stagingEnabled = True
        stagingToggleEnabledEditor = True
    }
}

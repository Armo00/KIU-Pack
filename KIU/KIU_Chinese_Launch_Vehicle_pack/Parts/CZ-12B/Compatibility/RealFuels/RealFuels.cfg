// KCLV_CZ12B 0.4.1, editable source configuration. RF switches both dimensions and propellants. No custom ignition consumable is required.

@PART[KCLV_CZ12B_EngineBay]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    %rescaleFactor = 1
    @mass = 4.0
}

@PART[KCLV_CZ12B_S1Tank]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    %rescaleFactor = 1
    @mass = 19.0
    !RESOURCE,*
    {
    }
    !MODULE[ModuleFuelTanks],*
    {
    }
    MODULE
    {
        name = ModuleFuelTanks
        type = KCLV_CZ12B_Kerolox
        volume = 430000
        basemass = -1
        TANK
        {
            name = Kerosene
            amount = Full
            maxAmount = 151419.66545274985
        }
        TANK
        {
            name = LqdOxygen
            amount = Full
            maxAmount = 278580.3345472501
        }
    }
}

@PART[KCLV_CZ12B_Interstage]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    %rescaleFactor = 1
    @mass = 2.9
    !RESOURCE,*
    {
    }
    !MODULE[ModuleFuelTanks],*
    {
    }
    MODULE
    {
        name = ModuleFuelTanks
        type = KCLV_CZ12B_ColdGas
        volume = 650
        basemass = -1
        TANK
        {
            name = Nitrogen
            amount = Full
            maxAmount = 120000
        }
        TANK
        {
            name = ElectricCharge
            amount = Full
            maxAmount = 8000
        }
    }
    @MODULE[ModuleRCSFX]
    {
        @resourceName = Nitrogen
        @thrusterPower = 0.45
        !PROPELLANT,*
        {
        }
        !atmosphereCurve
        {
        }
        atmosphereCurve
        {
            key = 0 70
            key = 1 60
        }
    }
    @MODULE[ModuleDecouple]
    {
        @ejectionForce = 0
    }
}


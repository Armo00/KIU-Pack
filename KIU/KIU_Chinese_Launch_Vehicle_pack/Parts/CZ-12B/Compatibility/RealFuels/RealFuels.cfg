@PART[KCLV_YF102R_CZ12B]:NEEDS[RealFuels]:AFTER[RealFuels]
{
    %rescaleFactor = 1
    @mass = 0.9
    @MODULE[ModuleEnginesFX]
    {
        @name = ModuleEnginesRF
    }
    !MODULE[ModuleEngineConfigs],*
    {
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        engineID = Main
        configuration = YF102R
        origMass = 0.9
        modded = false
        CONFIG
        {
            name = YF102R
            description = #KCLV_CZ12B_R_description
            minThrust = 408.0
            maxThrust = 1020
            heatProduction = 100
            massMult = 1
            cost = 0
            ullage = True
            pressureFed = False
            ignitions = 10
            PROPELLANT
            {
                name = Kerosene
                ratio = 0.3521387568668601
                DrawGauge = True
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.6478612431331399
                DrawGauge = False
            }
            atmosphereCurve
            {
                key = 0 337
                key = 1 295
            }
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 1
            }
        }
    }
}


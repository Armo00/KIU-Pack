// KCLV_CZ12B 0.4.1, editable source configuration. RT2 means the RemoteTech mod id. Both flight computers participate in command filtering.

@PART[KCLV_CZ12B_S1Tank]:NEEDS[RemoteTech]:AFTER[RemoteTech]
{
    !MODULE[ModuleDataTransmitter],*
    {
    }
    !MODULE[ModuleSPU],*
    {
    }
    !MODULE[ModuleRTAntenna],*
    {
    }
    MODULE
    {
        name = ModuleSPU
        IsRTCommandStation = False
    }
    MODULE
    {
        name = ModuleRTAntenna
        IsRTActive = True
        Mode0OmniRange = 0
        Mode1OmniRange = 5000000
        EnergyCost = 0.01
        TRANSMITTER
        {
            PacketInterval = 1
            PacketSize = 0.512
            PacketResourceCost = 0.025
            RequiredResource = ElectricCharge
        }
    }
}

@PART[KCLV_CZ12B_Avionics]:NEEDS[RemoteTech]:AFTER[RemoteTech]

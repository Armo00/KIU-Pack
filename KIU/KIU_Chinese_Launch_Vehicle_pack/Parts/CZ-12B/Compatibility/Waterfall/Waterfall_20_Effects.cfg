// KCLV_CZ12B 0.4.1, editable source configuration. 

@PART[KCLV_YF102R_CZ12B]:NEEDS[Waterfall]:AFTER[Waterfall]
{
    !MODULE[ModuleWaterfallFX],*
    {
    }
    @EFFECTS
    {
        @running
        {
            !MODEL_MULTI_PARTICLE,*
            {
            }
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = CZ12B_YF102R
        engineID = Main
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = Main
        }
        // Required by randBound/flicker modifiers in both stock kerolox templates.
        CONTROLLER
        {
            name = random
            linkedTo = random
            noiseType = random
            range = 0,1
        }
        // Template-local Z is exhaust length; X/Y remain the nozzle diameter scale.
        TEMPLATE
        {
            templateName = waterfall-kerolox-lower-1
            overrideParentTransform = fx_main
            position = 0,0,0
            rotation = 0,0,0
            scale = 0.9858, 0.9858, 2.9574
            @scale[*] *= #$/rescaleFactor$
        }
    }
}


// v0.5.5: RCS binding/orientation repair, independent of RF propellant selection.
@PART[KCLV_CZ12B_Interstage]:NEEDS[Waterfall]:AFTER[Waterfall]
{
    !MODULE[ModuleWaterfallFX],* {}
    @EFFECTS
    {
        @rcs { !MODEL_MULTI_PARTICLE,* {} }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = CZ12B_Interstage_RCS
        engineID = RCS
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = rcs
            linkedTo = rcs
            thrusterTransformName = rcsTransform
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            noiseType = random
            range = -1,1
        }
        TEMPLATE
        {
            templateName = ColdGasRCS
            overrideParentTransform = rcsTransform
            position = 0,0,0.005
            rotation = -90,0,0
            scale = 0.6,1.8,0.6
            @scale[*] *= #$/rescaleFactor$
        }
    }
}


// KCLV_CZ12B 0.4.1, editable source configuration. KIU Common/Extra sets KCLV* to 1 BEFORE[Waterfall]; restore this package's explicit scale contract afterwards.

@PART[KCLV_CZ12B_*|KCLV_YF102R_CZ12B|KCLV_YF102RV_CZ12B]:NEEDS[Waterfall,!RealFuels]:AFTER[Waterfall]
{
    %rescaleFactor = 0.6
}

@PART[KCLV_CZ12B_*|KCLV_YF102R_CZ12B|KCLV_YF102RV_CZ12B]:NEEDS[Waterfall,RealFuels]:AFTER[Waterfall]
{
    %rescaleFactor = 1
}

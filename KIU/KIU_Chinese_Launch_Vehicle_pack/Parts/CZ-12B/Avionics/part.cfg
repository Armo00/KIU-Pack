    node_stack_fairingB = -1.4142136, 0.5, -1.4142136, -0.70710678, 0, -0.70710678, 2
    vesselType = Probe
    // Stock connected-bay bridge: both petal attachment nodes must be capped.
    // lookupRadius=0: this adapter gates closure, petal render bounds do the shielding.
    // Stock jettison tracks a non-rendering state transform only.
    // The actual petal remains an independent ModuleDecouple part.
    MODULE
    {
        name = ModuleJettison
        jettisonName = stockBayState
        bottomNodeName = fairingA
        checkBottomNode = True
        isFairing = True
        stagingEnabled = False
        manualJettison = True
        decoupleEnabled = False
        hideJettisonMenu = True
        allowShroudToggle = False
        useMultipleDragCubes = False
        useProceduralDragCubes = True
        useCalculatedMass = False
        modifyJettisonedMass = False
        jettisonedObjectMass = 0
        jettisonForce = 0
    }
    MODULE
    {
        name = ModuleCargoBay
        DeployModuleIndex = 0
        closedPosition = 0
        lookupCenter = 0, 0, 0
        lookupRadius = 0
        nodeOuterAftID = fairingA
        nodeOuterForeID = fairingB
    }
    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.04
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = INTERNAL
        packetInterval = 1
        packetSize = 2
        packetResourceCost = 0.2
        requiredResource = ElectricCharge
        antennaPower = 5000000
        antennaCombinable = False
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 800.000000
        maxAmount = 800.000000
    }
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 2
        YawTorque = 2
        RollTorque = 2
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.03
        }
    }
    MODULE
    {
        name = ModuleDecouple
        ejectionForce = 20
        explosiveNodeID = top
        isOmniDecoupler = False
    }
}

// KCLV_CZ12B 0.4.1, editable source configuration. 

PART
{
    name = KCLV_CZ12B_Avionics
    module = Part
    author = CZ12B project
    rescaleFactor = 0.6
    TechRequired = veryHeavyRocketry
    entryCost = 9000
    cost = 4500
    category = Pods
    subcategory = 0
    title = #KCLV_CZ12B_Avionics_title
    manufacturer = #CASC
    description = #KCLV_CZ12B_Avionics_description
    tags = #KCLV_CZ12B_tags
    attachRules = 1,0,1,1,0
    mass = 0.216
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 20
    maxTemp = 2400
    breakingForce = 600
    breakingTorque = 600
    bulkheadProfiles = size3
    fuelCrossFeed = True
    MODEL
    {
        model = KIU/KIU_Chinese_Launch_Vehicle_pack/Parts/CZ-12B/Assets/Avionics
    }
    node_stack_top = 0, 0.5, 0, 0, 1, 0, 3
    node_stack_bottom = 0, -0.5, 0, 0, -1, 0, 3

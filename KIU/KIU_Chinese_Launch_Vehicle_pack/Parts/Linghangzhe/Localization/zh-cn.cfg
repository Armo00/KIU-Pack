        #KCLV_Linghangzhe_title = 领航者海上网系回收船
        #KCLV_Linghangzhe_description = 海上网系回收平台，配合长征十号乙至少四具回收挂钩使用。启用回收网，海上部署时可启用定点保持，滑车主动追踪下降芯级，四钩依次挂索后建立固定关系并自动熄火。挂钩回收24°，挂索下沉并轻微回弹。需以至少四个展开的挂钩从上方进入框架可达索区，目标支持15°倾斜、20米/秒进场，速度容错上限25米/秒；抓取不限制发动机数量、型号、推力或点火状态。内置大功率动量轮与SAS；无推进器，需自行布置部署方式。

        #KCLV_Linghangzhe_title = Linghangzhe Net Recovery Ship
        #KCLV_Linghangzhe_description = Ocean recovery platform for four CZ-10B recovery hooks. Enable station keeping and arm the net after deployment at sea. Rail carriages track the descending core; four hook contacts establish a fixed native connection and shut down the landing engine. Hooks retract 24 degrees, followed by cable yield and a small rebound. Enter the central 24 x 24 m region with four deployed hooks at no more than 20 m/s relative speed. Supports one YF-100 landing burn. No propulsion; arrange deployment separately.

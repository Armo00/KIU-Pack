        #KCLV_Linghangzhe_title = Linghangzhe Net Recovery Ship
        #KCLV_Linghangzhe_description = Ocean recovery platform for at least four CZ-10B recovery hooks. Arm the net on land or at sea; station keeping is available at sea. Rail carriages track the descending core; four hook contacts establish a fixed native connection and shut down the landing engine. Hooks retract 24 degrees, followed by cable yield and a small rebound. Enter the reachable cable region with at least four deployed hooks; target 15-degree / 20 m/s entry, speed ceiling 25 m/s. No capture restriction on engine count, type, thrust or ignition state. High-power reaction wheels and SAS included. No propulsion; arrange deployment separately.

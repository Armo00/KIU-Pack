// Modified 2026-09-17
// Xuntian (CSST) deep-sky survey experiment.
//
// RESULT KEYS
//   KSP resolves every RESULTS key at runtime as <Body><Situation>, using the
//   celestial body's runtime name, so the key set depends on the environment:
//     stock Kerbol system : Kerbin, Mun, Minmus, Duna, ...
//     RSS and Sol         : Earth, Moon, Mars, ...  (RSS renames Kerbin with
//                           cbNameLater = Earth; Sol names the body Earth
//                           outright -- so both share one namespace)
//   Keys for bodies that do not exist in the running system are inert, which is
//   why both sets live in this one ungated definition.
//
//   RSS, Sol and RP-1 only patch stock experiment ids by name, so a custom id is
//   never touched by them. This definition must therefore carry both key sets itself.
//
//   Key shape follows stock's magnetometer -- the only stock experiment with the
//   same space-only configuration (situationMask = 48, biomeMask = 0): it uses
//   <Body>InSpaceLow and <Body>InSpaceHigh plus a single default, with no bare
//   <Body>InSpace fallback.
//
//   Result text lives in Localization/{en_us,zh-cn}.cfg behind #KCDE_XT_RESULT_* keys.

EXPERIMENT_DEFINITION
{
	id = KCDE_XT_DeepSkySurvey
	title = #KCDE_XT_DeepSkySurvey_title
	baseValue = 30
	scienceCap = 40
	dataScale = 1

	requireAtmosphere = False
	requireNoAtmosphere = False
	situationMask = 48		// InSpaceLow + InSpaceHigh only / 仅低轨与高轨空间档
	biomeMask = 0

	RESULTS
	{
		default = #KCDE_XT_RESULT_default

		// ---------------- Kerbol system / 坎星系 ----------------
		SunInSpaceLow = #KCDE_XT_RESULT_SunInSpaceLow
		SunInSpaceHigh = #KCDE_XT_RESULT_SunInSpaceHigh

		KerbinInSpaceLow = #KCDE_XT_RESULT_KerbinInSpaceLow
		KerbinInSpaceHigh = #KCDE_XT_RESULT_KerbinInSpaceHigh

		MunInSpaceLow = #KCDE_XT_RESULT_MunInSpaceLow
		MunInSpaceHigh = #KCDE_XT_RESULT_MunInSpaceHigh

		MinmusInSpaceLow = #KCDE_XT_RESULT_MinmusInSpaceLow
		MinmusInSpaceHigh = #KCDE_XT_RESULT_MinmusInSpaceHigh

		MohoInSpaceLow = #KCDE_XT_RESULT_MohoInSpaceLow
		MohoInSpaceHigh = #KCDE_XT_RESULT_MohoInSpaceHigh

		EveInSpaceLow = #KCDE_XT_RESULT_EveInSpaceLow
		EveInSpaceHigh = #KCDE_XT_RESULT_EveInSpaceHigh

		GillyInSpaceLow = #KCDE_XT_RESULT_GillyInSpaceLow
		GillyInSpaceHigh = #KCDE_XT_RESULT_GillyInSpaceHigh

		DunaInSpaceLow = #KCDE_XT_RESULT_DunaInSpaceLow
		DunaInSpaceHigh = #KCDE_XT_RESULT_DunaInSpaceHigh

		IkeInSpaceLow = #KCDE_XT_RESULT_IkeInSpaceLow
		IkeInSpaceHigh = #KCDE_XT_RESULT_IkeInSpaceHigh

		DresInSpaceLow = #KCDE_XT_RESULT_DresInSpaceLow
		DresInSpaceHigh = #KCDE_XT_RESULT_DresInSpaceHigh

		JoolInSpaceLow = #KCDE_XT_RESULT_JoolInSpaceLow
		JoolInSpaceHigh = #KCDE_XT_RESULT_JoolInSpaceHigh

		LaytheInSpaceLow = #KCDE_XT_RESULT_LaytheInSpaceLow
		LaytheInSpaceHigh = #KCDE_XT_RESULT_LaytheInSpaceHigh

		VallInSpaceLow = #KCDE_XT_RESULT_VallInSpaceLow
		VallInSpaceHigh = #KCDE_XT_RESULT_VallInSpaceHigh

		TyloInSpaceLow = #KCDE_XT_RESULT_TyloInSpaceLow
		TyloInSpaceHigh = #KCDE_XT_RESULT_TyloInSpaceHigh

		BopInSpaceLow = #KCDE_XT_RESULT_BopInSpaceLow
		BopInSpaceHigh = #KCDE_XT_RESULT_BopInSpaceHigh

		PolInSpaceLow = #KCDE_XT_RESULT_PolInSpaceLow
		PolInSpaceHigh = #KCDE_XT_RESULT_PolInSpaceHigh

		EelooInSpaceLow = #KCDE_XT_RESULT_EelooInSpaceLow
		EelooInSpaceHigh = #KCDE_XT_RESULT_EelooInSpaceHigh

		// ---------------- Real solar system / 真实太阳系 ----------------
		// Serves both RSS and Sol; they share one result namespace.
		MercuryInSpaceLow = #KCDE_XT_RESULT_MercuryInSpaceLow
		MercuryInSpaceHigh = #KCDE_XT_RESULT_MercuryInSpaceHigh

		VenusInSpaceLow = #KCDE_XT_RESULT_VenusInSpaceLow
		VenusInSpaceHigh = #KCDE_XT_RESULT_VenusInSpaceHigh

		EarthInSpaceLow = #KCDE_XT_RESULT_EarthInSpaceLow
		EarthInSpaceHigh = #KCDE_XT_RESULT_EarthInSpaceHigh

		MoonInSpaceLow = #KCDE_XT_RESULT_MoonInSpaceLow
		MoonInSpaceHigh = #KCDE_XT_RESULT_MoonInSpaceHigh

		MarsInSpaceLow = #KCDE_XT_RESULT_MarsInSpaceLow
		MarsInSpaceHigh = #KCDE_XT_RESULT_MarsInSpaceHigh

		PhobosInSpaceLow = #KCDE_XT_RESULT_PhobosInSpaceLow
		PhobosInSpaceHigh = #KCDE_XT_RESULT_PhobosInSpaceHigh

		DeimosInSpaceLow = #KCDE_XT_RESULT_DeimosInSpaceLow
		DeimosInSpaceHigh = #KCDE_XT_RESULT_DeimosInSpaceHigh

		CeresInSpaceLow = #KCDE_XT_RESULT_CeresInSpaceLow
		CeresInSpaceHigh = #KCDE_XT_RESULT_CeresInSpaceHigh

		VestaInSpaceLow = #KCDE_XT_RESULT_VestaInSpaceLow
		VestaInSpaceHigh = #KCDE_XT_RESULT_VestaInSpaceHigh

		JupiterInSpaceLow = #KCDE_XT_RESULT_JupiterInSpaceLow
		JupiterInSpaceHigh = #KCDE_XT_RESULT_JupiterInSpaceHigh

		IoInSpaceLow = #KCDE_XT_RESULT_IoInSpaceLow
		IoInSpaceHigh = #KCDE_XT_RESULT_IoInSpaceHigh

		EuropaInSpaceLow = #KCDE_XT_RESULT_EuropaInSpaceLow
		EuropaInSpaceHigh = #KCDE_XT_RESULT_EuropaInSpaceHigh

		GanymedeInSpaceLow = #KCDE_XT_RESULT_GanymedeInSpaceLow
		GanymedeInSpaceHigh = #KCDE_XT_RESULT_GanymedeInSpaceHigh

		CallistoInSpaceLow = #KCDE_XT_RESULT_CallistoInSpaceLow
		CallistoInSpaceHigh = #KCDE_XT_RESULT_CallistoInSpaceHigh

		SaturnInSpaceLow = #KCDE_XT_RESULT_SaturnInSpaceLow
		SaturnInSpaceHigh = #KCDE_XT_RESULT_SaturnInSpaceHigh

		TitanInSpaceLow = #KCDE_XT_RESULT_TitanInSpaceLow
		TitanInSpaceHigh = #KCDE_XT_RESULT_TitanInSpaceHigh

		UranusInSpaceLow = #KCDE_XT_RESULT_UranusInSpaceLow
		UranusInSpaceHigh = #KCDE_XT_RESULT_UranusInSpaceHigh

		NeptuneInSpaceLow = #KCDE_XT_RESULT_NeptuneInSpaceLow
		NeptuneInSpaceHigh = #KCDE_XT_RESULT_NeptuneInSpaceHigh

		PlutoInSpaceLow = #KCDE_XT_RESULT_PlutoInSpaceLow
		PlutoInSpaceHigh = #KCDE_XT_RESULT_PlutoInSpaceHigh
	}
}

PART
{
	name = KCDE_XT_Telescope
	module = Part
	author = KIU
	MODEL
	{
		model = KIU/KIU_Chinese_Deepspace_Exploration_pack/Parts/Xuntian/Telescope/KCDE_XT_Telescope
		texture = Ref_ChinaFlag, KIU/Common/KIU_Common_texture/Shared_ChinaFlag.v3.3.1
	}

	rescaleFactor = 1
	TechRequired = advScienceTech
	entryCost = 56000
	cost = 28000
	category = Science
	subcategory = 0
	title = #KCDE_XT_Telescope_title
	manufacturer = #CNSA
	description = #KCDE_XT_Telescope_description
	tags = #KCDE_XT_Telescope_tags
	attachRules = 1,0,1,1,0
	mass = 6.5
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 10
	maxTemp = 1600
	breakingForce = 200
	breakingTorque = 200
	bulkheadProfiles = size3, srf
	vesselType = Ship
	node_stack_bottom = 0,0,0,0,-1,0,3

	MODULE
	{
		name = ModuleAnimateGeneric
		instantAnimInEditor = False
		animationName = OpenCover
		startEventGUIName = #KCDE_XT_Cover_Open
		endEventGUIName = #KCDE_XT_Cover_Close
		actionGUIName = #KCDE_XT_Cover_Toggle
		allowAnimationWhileShielded = False
	}

	// The cover is manual only. Stock's ModuleScienceExperiment can drive a part's
	// first fx module (FxModules = 0), which opens the cover when the survey runs --
	// but the same binding retracts it again on experiment reset, and the two halves
	// cannot be separated from a config. Leaving FxModules out keeps the cover on its
	// own ModuleAnimateGeneric, where it opens and closes only when asked to.
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = KCDE_XT_DeepSkySurvey
		experimentActionName = #KCDE_XT_Survey_Start
		resetActionName = #KCDE_XT_Survey_Reset
		reviewActionName = #KCDE_XT_Survey_Review
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = True
		resettable = True
		resettableOnEVA = True
		xmitDataScalar = 1
		dataIsCollectable = True
		collectActionName = #KCDE_XT_Survey_Collect
		interactionRange = 2
		usageReqMaskInternal = 1
		usageReqMaskExternal = 8
		hideFxModuleUI = False
		dialogDelay = 4
	}

	EFFECTS
	{
		running
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/Monoprop_small
				transformName = rcsThrust
				emission = 0.0 0.0
				emission = 0.05 0.0
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				localRotation = -90, 0, 0
			}
		}
	}

	MODULE
	{
		name = ModuleRCSFX
		stagingEnabled = False
		thrusterTransformName = rcsThrust
		thrusterPower = 0.12
		resourceName = MonoPropellant
		resourceFlowMode = STAGE_PRIORITY_FLOW
		useZaxis = False
		runningEffectName = running
		enablePitch = True
		enableYaw = True
		enableRoll = True
		enableX = True
		enableY = True
		enableZ = True
		showToggles = True
		atmosphereCurve
		{
			key = 0 260
			key = 1 100
			key = 4 0.001
		}
	}
}

        // ********** Experiment: Xuntian deep-sky survey
        #KCDE_XT_DeepSkySurvey_title = Xuntian Sky Survey
        #KCDE_XT_RESULT_default = The survey sweeps the sky above the observatory, logging star fields, faint nebulae and distant galaxies beyond the last of the local glow.

        // ----- Kerbol system -----
        #KCDE_XT_RESULT_SunInSpaceLow = With the sunshield held against the Sun, the survey works the year's darkest fields, where the Milky Way crosses within a few degrees of the disc.
        #KCDE_XT_RESULT_SunInSpaceHigh = From low solar orbit the ecliptic dominates the sky, and the survey maps the dust bands that catch the sunlight between the planets.
        #KCDE_XT_RESULT_KerbinInSpaceLow = Kerbin hides one hemisphere of sky behind an opaque disc with a bright limb; the survey uses the dark side of that disc to mask the home world's own glow.
        #KCDE_XT_RESULT_KerbinInSpaceHigh = High above Kerbin the sky is the darkest the survey will ever see, and the deep fields run uninterrupted from the terminator to the pole.
        #KCDE_XT_RESULT_MunInSpaceLow = The Mun's airless limb cuts the sky with an edge sharp enough to use as a reference, and the fields it grazes hold no scattered light.
        #KCDE_XT_RESULT_MunInSpaceHigh = The Mun's grey disc blocks the brightest part of the home sky, and the deep fields behind it come out cleaner than anywhere nearer in.
        #KCDE_XT_RESULT_MinmusInSpaceLow = The ice flats throw back sunlight in long glints that fade with distance, leaving only a pale speck against a very dark sky.
        #KCDE_XT_RESULT_MinmusInSpaceHigh = Far from the inner worlds the survey uses Minmus as a dark anchor and maps the outer star fields for weeks at a time.
        #KCDE_XT_RESULT_MohoInSpaceLow = The Sun's glare fills half the sky here, and the survey retreats to the shadowed side of the planet for the few deep fields it can reach.
        #KCDE_XT_RESULT_MohoInSpaceHigh = The inner system is bright with zodiacal dust, so the survey spends its time on the galactic plane rather than on faint galaxies.
        #KCDE_XT_RESULT_EveInSpaceLow = Eve's cloud deck is bright enough to light the instrument bay, and the survey works only with the planet between it and the Sun.
        #KCDE_XT_RESULT_EveInSpaceHigh = The purple disc blocks a wide swath of sky, and the survey measures the Milky Way's light as it dims behind the planet.
        #KCDE_XT_RESULT_GillyInSpaceLow = Barely more than a rock, Gilly brings the survey close to the inner system's brightest star fields without adding any glow of its own.
        #KCDE_XT_RESULT_GillyInSpaceHigh = A dark speck against the galaxy, it serves as a reference point while the survey counts stars toward the core.
        #KCDE_XT_RESULT_DunaInSpaceLow = Duna's rust-red disc is dark enough to work against, and its edge gives the survey a clean line between sky and planet.
        #KCDE_XT_RESULT_DunaInSpaceHigh = The sky here is darker than at Kerbin, and the survey's faintest fields run outward from the planet's shadow.
        #KCDE_XT_RESULT_IkeInSpaceLow = A grey rock with no atmosphere gives the survey a hard, unlit edge to work against and no scattered light to fight.
        #KCDE_XT_RESULT_IkeInSpaceHigh = Ike blocks the inner sky, and the deep fields behind it reach magnitudes the survey cannot touch nearer home.
        #KCDE_XT_RESULT_DresInSpaceLow = Far from the ecliptic's dust, Dres offers the survey some of the darkest sky in the system.
        #KCDE_XT_RESULT_DresInSpaceHigh = The survey anchors on Dres and works outward, mapping faint galaxies that are lost in the glare nearer the Sun.
        #KCDE_XT_RESULT_JoolInSpaceLow = Jool's banded disc is bright, but the empty black sky beside the planet is ideal for deep fields.
        #KCDE_XT_RESULT_JoolInSpaceHigh = The giant replaces a wide arc of sky with a glowing disc, and the survey measures the Milky Way's brightness on either side of it.
        #KCDE_XT_RESULT_LaytheInSpaceLow = Laythe's atmosphere scatters a faint blue rim along the planet's edge, and the survey uses that rim to calibrate its own stray light.
        #KCDE_XT_RESULT_LaytheInSpaceHigh = The bright moon is a strong light source in an otherwise dark sky, and the survey works the hemisphere facing away from it.
        #KCDE_XT_RESULT_VallInSpaceLow = Vall's ice sheet reflects enough sunlight to be a hazard, so the survey keeps the moon behind the sunshield.
        #KCDE_XT_RESULT_VallInSpaceHigh = The high-albedo moon scatters light across the whole field, and the survey waits for it to set before its longest exposures.
        #KCDE_XT_RESULT_TyloInSpaceLow = Tylo provides a large, completely dark disc, and the survey uses it to mask the brightest part of the sky.
        #KCDE_XT_RESULT_TyloInSpaceHigh = The moon's dark limb gives the survey a clean horizon to measure the sky's background against.
        #KCDE_XT_RESULT_BopInSpaceLow = Bop is small and dark enough that the survey can work right up to its edge without stray light.
        #KCDE_XT_RESULT_BopInSpaceHigh = A dark speck in a dark sky, it lets the survey track its own pointing across long exposures.
        #KCDE_XT_RESULT_PolInSpaceLow = The spiky moon adds no glow, and the sky it sits against is dark enough for the survey's faintest targets.
        #KCDE_XT_RESULT_PolInSpaceHigh = Pol marks the outer system for the survey, and the fields beyond it are the darkest it will ever record.
        #KCDE_XT_RESULT_EelooInSpaceLow = At the system's edge the zodiacal glow is all but gone, and the survey measures how dark the sky can really get.
        #KCDE_XT_RESULT_EelooInSpaceHigh = The survey's deepest exposures come from here, where neither the Sun nor the dust between the planets adds anything to the field.

        // ----- Real solar system (shared by RSS and Sol) -----
        #KCDE_XT_RESULT_EarthInSpaceLow = Earth hides one hemisphere of sky behind an opaque disc with a bright limb; the survey uses the dark side of that disc to mask the home world's own glow.
        #KCDE_XT_RESULT_EarthInSpaceHigh = High above Earth the sky is the darkest the survey will ever see, and the deep fields run uninterrupted from the terminator to the pole.
        #KCDE_XT_RESULT_MoonInSpaceLow = The Moon's airless limb cuts the sky with an edge sharp enough to use as a reference, and the fields it grazes hold no scattered light.
        #KCDE_XT_RESULT_MoonInSpaceHigh = The grey disc blocks the brightest part of the home sky, and the deep fields behind it come out cleaner than anywhere nearer in.
        #KCDE_XT_RESULT_MercuryInSpaceLow = The Sun fills half the sky at Mercury, so the survey works in the planet's shadow and maps the dust rings it can reach.
        #KCDE_XT_RESULT_MercuryInSpaceHigh = Close in, the zodiacal dust is bright; the survey uses the planet's silhouette to separate it from the true sky.
        #KCDE_XT_RESULT_VenusInSpaceLow = Venus is bright enough to ruin a field, so the survey keeps it to the edge and works the opposite hemisphere.
        #KCDE_XT_RESULT_VenusInSpaceHigh = The brilliant disc blocks a wide arc of sky, and the survey measures the faint halo its light puts into the optics.
        #KCDE_XT_RESULT_MarsInSpaceLow = Mars is dark enough to work against, and its edge gives the survey a clean line between sky and disc.
        #KCDE_XT_RESULT_MarsInSpaceHigh = Beyond Mars the zodiacal dust thins, and the survey's faintest fields open up behind the planet.
        #KCDE_XT_RESULT_PhobosInSpaceLow = Phobos crosses the field in hours and takes a bite out of the sky, and the survey uses the gap it leaves to check its own photometry.
        #KCDE_XT_RESULT_PhobosInSpaceHigh = A dark, irregular speck, Phobos gives the survey a moving reference against the star field.
        #KCDE_XT_RESULT_DeimosInSpaceLow = Deimos is small and dark, and the survey works right past its limb without any scattered light.
        #KCDE_XT_RESULT_DeimosInSpaceHigh = From Deimos's distance the ecliptic is still bright, and the survey maps the dust bands across it.
        #KCDE_XT_RESULT_CeresInSpaceLow = Ceres marks the inner edge of the dark belt, and the survey's fields here are already cleaner than anything near Mars.
        #KCDE_XT_RESULT_CeresInSpaceHigh = Far from the planets' dust, Ceres gives the survey a still point to work from while it counts galaxies.
        #KCDE_XT_RESULT_VestaInSpaceLow = Vesta's bright surface is put behind the sunshield so the survey can keep a patch of dark sky beside the asteroid.
        #KCDE_XT_RESULT_VestaInSpaceHigh = The asteroid's own reflected light is measured and subtracted, field by field.
        #KCDE_XT_RESULT_JupiterInSpaceLow = Jupiter's disc and its four moons take up a wide arc, but the black sky beside the planet is excellent for deep fields.
        #KCDE_XT_RESULT_JupiterInSpaceHigh = The giant's magnetosphere lights its own aurora, and the survey uses it as a background calibration source.
        #KCDE_XT_RESULT_IoInSpaceLow = Io's volcanic plumes throw material into the sky beside it, and the survey measures the haze they leave in the field.
        #KCDE_XT_RESULT_IoInSpaceHigh = The moon sits inside Jupiter's brightest radiation, and the survey works the brief windows when its own noise drops.
        #KCDE_XT_RESULT_EuropaInSpaceLow = Europa's bright ice makes a hard edge against the sky, and the survey uses that edge to test its own optics.
        #KCDE_XT_RESULT_EuropaInSpaceHigh = The ice moon is a strong scattered-light source, so the survey works the far side of the field.
        #KCDE_XT_RESULT_GanymedeInSpaceLow = Ganymede's dark plains and bright grooved terrain give the survey two reference levels in the same frame.
        #KCDE_XT_RESULT_GanymedeInSpaceHigh = Its own aurora adds a faint line to the sky, which the survey removes from its longest fields.
        #KCDE_XT_RESULT_CallistoInSpaceLow = Callisto is dark and quiet, and the sky beside it is among the cleanest the survey has.
        #KCDE_XT_RESULT_CallistoInSpaceHigh = Outside the worst of the radiation, Callisto lets the survey run long, uninterrupted integrations.
        #KCDE_XT_RESULT_SaturnInSpaceLow = Saturn's rings scatter light across a wide arc, and the survey keeps to the shadowed side of the planet.
        #KCDE_XT_RESULT_SaturnInSpaceHigh = The ring system is a bright foreground, so the survey measures the sky on the far side of the planet from it.
        #KCDE_XT_RESULT_TitanInSpaceLow = Titan's orange haze glows faintly against the dark sky, and the survey uses it to check its own colour calibration.
        #KCDE_XT_RESULT_TitanInSpaceHigh = The haze moon is the brightest thing in an otherwise empty field, and the survey subtracts its light from every frame.
        #KCDE_XT_RESULT_UranusInSpaceLow = Uranus is a dim, featureless disc that blocks almost nothing, and the deep fields run straight past its limb.
        #KCDE_XT_RESULT_UranusInSpaceHigh = Far from the dust, the ice giant's sky is dark in every direction, and the survey's longest integrations come from here.
        #KCDE_XT_RESULT_NeptuneInSpaceLow = Neptune's blue disc adds almost no glare, and the survey works the sky on both sides of it.
        #KCDE_XT_RESULT_NeptuneInSpaceHigh = The farthest giant marks the survey's outer limit, where the sky holds only stars and galaxies.
        #KCDE_XT_RESULT_PlutoInSpaceLow = Pluto is dim enough to be ignored, and the survey uses the empty sky around it for its faintest fields.
        #KCDE_XT_RESULT_PlutoInSpaceHigh = Beyond the last planet the survey measures the true darkness of interplanetary space.
    }
}
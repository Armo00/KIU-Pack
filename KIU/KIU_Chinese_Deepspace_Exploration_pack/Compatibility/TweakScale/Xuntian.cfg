// Modified 2026-09-17
// Xuntian (CSST) -- TweakScale.
//
// Values follow the pack-wide convention: the RealFuels figure is the part's
// real size in metres and the stock figure is that value x 0.6, which is the
// same 1.667 ratio every other KIU part uses.

// 3m-class parts
@PART[KCDE_XT_ServiceModule|KCDE_XT_Telescope]:NEEDS[TweakScale,RealFuels]
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 3.0
    }
}

@PART[KCDE_XT_ServiceModule|KCDE_XT_Telescope]:NEEDS[TweakScale,!RealFuels]
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.8
    }
}

// Deployable wing, roughly 8m across when extended
@PART[KCDE_XT_SolarWing]:NEEDS[TweakScale,RealFuels]
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 8.0
    }
}

@PART[KCDE_XT_SolarWing]:NEEDS[TweakScale,!RealFuels]
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 4.8
    }
}

// size-1 class parts
@PART[KCDE_XT_Antenna|KCDE_XT_DockingPort]:NEEDS[TweakScale,RealFuels]
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 1.25
    }
}

@PART[KCDE_XT_Antenna|KCDE_XT_DockingPort]:NEEDS[TweakScale,!RealFuels]
{
    %MODULE[TweakScale]
    {
        %type = stack
        %defaultScale = 0.75
    }
}

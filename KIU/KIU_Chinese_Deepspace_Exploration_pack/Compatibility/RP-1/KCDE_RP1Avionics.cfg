// ============================================================
// KCDE_RP1Avionics (KCDE - Deepspace Exploration pack)
// RP-1 avionics (ModuleAvionics) patch for KCDE probe parts.
//
// Purpose:
//   KCDE probes carry ModuleCommand with minimumCrew = 0 but no
//   ModuleAvionics. RP-1's generic fallback (Avionics.cfg)
//   therefore injects ModuleAvionics with massLimit = 0, making
//   these craft uncontrollable. This patch injects ModuleAvionics
//   with a real massLimit at FOR[RP-0] (before the AFTER[RP-0]
//   fallback), so the fallback skips them.
//
// massLimit basis: the whole spacecraft stack mass each avionics
// must be able to control, with a generous margin.
//
// Dependencies:
//   - RP-1  (ModuleManager identifier: RP-0)
//   - KIU   (GameData folder name: KIU)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// Tianwen-1 Orbiter: controls full stack (~5t), margin included
@PART[KCDE_Tianwen1_Orbiter]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 10
	}
}

// Tianwen-1 Lander: ~1.4t
@PART[KCDE_Tianwen1_Lander]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 10
	}
}

// Zhurong rover: ~0.24t
@PART[KCDE_Tianwen1_Zhurong]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 5
	}
}

// Chang'e-2: ~2.5t
@PART[KCDE_ChangE2_MainBody]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 10
	}
}

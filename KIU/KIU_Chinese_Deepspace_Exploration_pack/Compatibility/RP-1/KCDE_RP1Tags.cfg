// ============================================================
// KCDE_RP1Patch - Module Tags (KCDE - Chinese Deepspace Exploration pack)
//
// Purpose:
//   Add RP-1 ModuleTagList tags to KCDE parts so they participate
//   in RP-1's tooling, procurement, human-rating and reentry
//   systems. Applied BEFORE[zzzRP-0] so tags are present before
//   RP-1 cleanup.
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//   - KIU  (GameData folder: KIU)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- EngineLiquidPF ----------
// 挤压式/单组元液体发动机与 RCS 推力器（深空探测器发动机、姿控）。
// 4 part(s)
@PART[KCDE_490N_Engine|KCDE_Tianwen1_Orbiter_Engine|KCDE_Tianwen1_Lander_Engine|KCDE_Tianwen1_Lander_RCS]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = EngineLiquidPF }
}

// ---------- Reentry ----------
// 再入部件：热盾、降落伞。触发 RP-1 再入/EDL 逻辑。
// 2 part(s)
@PART[KCDE_Tianwen1_Heat_Shield|KCDE_Tianwen1_Parachute]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = Reentry }
}

// ---------- Instruments ----------
// 天线（RP-1 把天线归为 Instruments 类）。
// 3 part(s)
@PART[KCDE_ChangE2_Antenna|KCDE_Tianwen1_Antenna|KCDE_Tianwen1_ZHurong_Antenna]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = Instruments }
}
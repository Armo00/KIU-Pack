// ===========================================================================
// KCDE RP-1 开模(Tooling)补丁
// 按 RP-1 现有定义(SSPX.cfg 写法)为固定尺寸探测器主体显式添加 ModuleToolingDiamLen。
// 主体结构 -> Stringers
// 尺寸为公开数据/估算值，仅用于开模成本计算与 UI 展示。
// 发动机已由 ModuleEngineConfigs + RP-0 自行处理，无需在此添加。
// ===========================================================================

@PART[KCDE_ChangE2_MainBody]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	MODULE
	{
		name = ModuleToolingDiamLen
		toolingName = Tool Stringers
		toolingType = Stringers
		untooledMultiplier = 0.0625
		finalToolingCostMultiplier = 0.0625
		costMultiplierDL = 3.5
		partDiameter = 2.0
		partLength = 2
	}
}

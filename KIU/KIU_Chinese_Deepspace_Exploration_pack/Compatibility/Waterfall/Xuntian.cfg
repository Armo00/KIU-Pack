// Modified 2026-09-17
// Xuntian (CSST) -- Waterfall RCS plumes.
//
// Transform is rcsThrust on both parts. Without Waterfall the stock
// MODEL_MULTI_PARTICLE effects in the part configs stay in place, since this
// patch only applies under :NEEDS[Waterfall].

@PART[KCDE_XT_ServiceModule]:NEEDS[Waterfall]:FINAL
{
    !EFFECTS {}
    EFFECTS
    {
        running
        {
            AUDIO_MULTI_POOL
            {
                channel = Ship
                transformName = rcsThrust
                clip = sound_rocket_hard
                volume = 0.0 0.0
                volume = 0.1 0.0
                volume = 0.5 0.5
                volume = 1.0 0.5
                pitch = 0.0 0.75
                pitch = 1.0 1.5
                loop = true
            }
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = Xuntian_ServiceModule_RCS
        engineID = basicEngine

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = rcs
            linkedTo = rcs
        }
        TEMPLATE
        {
            templateName = NewRCS
            overrideParentTransform = rcsThrust
            position = 0,0,0
            rotation = 0, 0, 180
            scale = 1.4, 4.2, 1.4
            @scale[*] *= #$/rescaleFactor$
        }
    }
}

@PART[KCDE_XT_Telescope]:NEEDS[Waterfall]:FINAL
{
    !EFFECTS {}
    EFFECTS
    {
        running
        {
            AUDIO_MULTI_POOL
            {
                channel = Ship
                transformName = rcsThrust
                clip = sound_rocket_hard
                volume = 0.0 0.0
                volume = 0.1 0.0
                volume = 0.5 0.5
                volume = 1.0 0.5
                pitch = 0.0 0.75
                pitch = 1.0 1.5
                loop = true
            }
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = Xuntian_Telescope_RCS
        engineID = basicEngine

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = rcs
            linkedTo = rcs
        }
        TEMPLATE
        {
            templateName = NewRCS
            overrideParentTransform = rcsThrust
            position = 0,0,0
            rotation = 0, 0, 180
            scale = 1.2, 3.6, 1.2
            @scale[*] *= #$/rescaleFactor$
        }
    }
}

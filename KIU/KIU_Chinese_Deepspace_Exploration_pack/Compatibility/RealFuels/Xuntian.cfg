// Modified 2026-09-17
// Xuntian (CSST) -- RealFuels conversion.
//
// The observatory is a hypergolic spacecraft: both the service bus and the
// telescope carry MMH/NTO RCS thrusters, but only the bus has tanks. Propellant
// and batteries for the whole stack live on the bus; the telescope's thrusters
// draw from it across the vessel.
//
// No part of this patch may depend on a RealismOverhaul-only resource: the Sol
// environment runs RealFuels without RO or RP-1.

// Service Module
// The observatorys real dry mass is 15.5t; the telescope accounts for 6.5t of
// that, leaving 9.0t for the bus. The bus carries all of the propellant and
// batteries for the whole stack.
@PART[KCDE_XT_ServiceModule]:NEEDS[RealFuels]:FINAL
{
    @mass = 9.0
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        type = ServiceModule
        volume = 3000
        basemass = -1
        TANK
        {
            name = MMH
            amount = Full
            maxAmount = 853
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 849
        }
        TANK
        {
            name = ElectricCharge
            amount = Full
            maxAmount = 7500
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        techLevel = 1
        origTechLevel = 1
        engineType = L
        origMass = -1
        configuration = MMH/NTO
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.12
            PROPELLANT
            {
                name = MMH
                ratio = 0.4990
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5010
            }
            atmosphereCurve
            {
                key = 0 310
                key = 1 250
            }
        }
        CONFIG
        {
            name = Hydrazine
            thrusterPower = 0.1
            PROPELLANT
            {
                name = Hydrazine
                ratio = 1.0
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 290
                key = 1 250
            }
        }
    }
}

// Telescope
// The optical assembly carries no propellant and no batteries of its own: its
// RCS draws from the service bus tanks on the same vessel. ModuleEngineConfigs
// still declares what the thrusters burn, but adds no tank.
@PART[KCDE_XT_Telescope]:NEEDS[RealFuels]:FINAL
{
    @mass = 6.5
    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        techLevel = 1
        origTechLevel = 1
        engineType = L
        origMass = -1
        configuration = MMH/NTO
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.12
            PROPELLANT
            {
                name = MMH
                ratio = 0.4990
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5010
            }
            atmosphereCurve
            {
                key = 0 310
                key = 1 250
            }
        }
        CONFIG
        {
            name = Hydrazine
            thrusterPower = 0.1
            PROPELLANT
            {
                name = Hydrazine
                ratio = 1.0
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 290
                key = 1 250
            }
        }
    }
}

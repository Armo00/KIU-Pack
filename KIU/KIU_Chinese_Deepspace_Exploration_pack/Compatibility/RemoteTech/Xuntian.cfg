// Modified 2026-09-17

// Xuntian Antenna
// Supplied antennaPower = 2000000000, i.e. a high-gain deep space dish.
@PART[KCDE_XT_Antenna]:NEEDS[RemoteTech]
{
    %MODULE[ModuleRTAntenna]
    {
        %Mode0DishRange = 0
        %Mode1DishRange = 2000000000000		// 20亿公里
        %EnergyCost = 0.002
        %MaxQ = 8000
        %DishAngle = 0.5

        %DeployFxModules = 0
        %ProgressFxModules = 0

        %TRANSMITTER
        {
            %PacketInterval = 0.35
            %PacketSize = 4.0
            %PacketResourceCost = 10.0
        }
    }

    %MODULE[ModuleSPUPassive] {}
}

// Xuntian Service Module -- command point of the observatory
@PART[KCDE_XT_ServiceModule]:NEEDS[RemoteTech]
{
    !MODULE[ModuleDataTransmitter] {}
    %MODULE[ModuleSPU] {}
    %MODULE[ModuleRTAntennaPassive]
    {
        %OmniRange = 50000000
    }
}

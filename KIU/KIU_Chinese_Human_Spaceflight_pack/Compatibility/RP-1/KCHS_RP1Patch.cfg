// ============================================================
// KCHS_RP1Patch (KCHS - Chinese Human Spaceflight pack)
// Minimal RP-1 visibility patch for KCHS parts.
//
// Purpose:
//   KCHS parts set RSSROConfig=True via their RO compatibility
//   patches but lack the RP0conf marker. RP-1's NonRP0.cfg
//   therefore moves them to category 99 (with FilterExtensions)
//   or -1 (hidden, with NoNonRP0 folder), making them invisible
//   in the VAB/SPH even in sandbox mode.
//
//   This patch stamps RP0conf=True on every KCHS part BEFORE the
//   zzzRP-0 pass so RP-1's cleanup logic skips them.
//
// Scope:
//   - Only marks parts as RP-1 configured. Does NOT add tech-tree
//     placement, costs, entry costs, ECM, RP-1 categories, or
//     Module Tags.
//
// Dependencies:
//   - RP-1  (ModuleManager identifier: RP-0)
//   - KIU   (GameData folder name: KIU)
//   The patch only fires when RP-0 is present.
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

@PART[KCHS_*]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    %RP0conf = True
}
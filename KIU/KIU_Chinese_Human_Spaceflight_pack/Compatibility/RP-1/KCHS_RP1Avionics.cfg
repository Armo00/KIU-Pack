// ============================================================
// KCHS_RP1Avionics (KCHS - Human Spaceflight pack)
// RP-1 avionics (ModuleAvionics) patch for KCHS command parts.
//
// Purpose:
//   KCHS spacecraft/station parts carry ModuleCommand with
//   minimumCrew = 0 but no ModuleAvionics. RP-1's generic
//   fallback (Avionics.cfg) therefore injects ModuleAvionics
//   with massLimit = 0, making these craft uncontrollable.
//   This patch injects ModuleAvionics with a real massLimit at
//   FOR[RP-0] (before the AFTER[RP-0] fallback), so the
//   fallback skips them.
//
// massLimit basis: the whole spacecraft/station stack mass each
// avionics must be able to control, with a generous margin.
//
// Dependencies:
//   - RP-1  (ModuleManager identifier: RP-0)
//   - KIU   (GameData folder name: KIU)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// Mengzhou crewed spacecraft: full stack (CM+SM) ~26t
@PART[KCHS_Mengzhou_ReEntry_Module]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 50
	}
}

// Lanyue lunar lander stack
@PART[KCHS_Lanyue_Crew_Compartment]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 30
	}
}

// Shenzhou spacecraft: full stack (RM+OM+SM) ~8t
@PART[KCHS_SZ_Re_entryModule|KCHS_SZ_OrbitalModule]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 20
	}
}

// Tianzhou cargo spacecraft: ~13.5t
@PART[KCHS_TZ_CargoModule]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 30
	}
}

// Space station core/lab modules: ~22-23t each
@PART[KCHS_TG_LaboratoryModule|KCHS_Tianhe_DZD|KCHS_LaboratoryCabinModule_Wentian_DZD|KCHS_LaboratoryCabinModule_Mengtian_DZD]:NEEDS[RP-0]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 50
	}
}

// ============================================================
// KCHS_RP1Patch - Module Tags (KCHS - Chinese Human Spaceflight pack)
//
// Purpose:
//   Add RP-1 ModuleTagList tags to KCHS parts so they participate
//   in RP-1's tooling, procurement, human-rating and reentry
//   systems. Applied BEFORE[zzzRP-0] so tags are present before
//   RP-1 cleanup.
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//   - KIU  (GameData folder: KIU)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- EngineLiquidPF ----------
// 挤压式/单组元液体发动机与 RCS 推力器（飞船主推进、姿控）。
// 6 part(s)
@PART[KCHS_Mengzhou_Engine|KCHS_TG_MainEngine|KCHS_TZ_MainEngine|KCHS_Lanyue_Crew_Compartment_Engine|KCHS_Lanyue_Service_Module_Engine|KCHS_Lanyue_Crew_Compartment_RCS]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = EngineLiquidPF }
}

// ---------- HumanRated ----------
// 载人舱/返回舱/载人空间站舱段。触发 RP-1 载人资格与失效逻辑。
// 14 part(s)
@PART[KCHS_SZ_Re_entryModule|KCHS_Mengzhou_ReEntry_Module|KCHS_Lanyue_Crew_Compartment|KCHS_SZ_OrbitalModule|KCHS_TG_LaboratoryModule|KCHS_Tianhe_JDC|KCHS_Tianhe_JXB|KCHS_Tianhe_DZD|KCHS_Tianhe_XZD|KCHS_LaboratoryCabinModule_XJXB|KCHS_LaboratoryCabinModule_Mengtian_DZD|KCHS_LaboratoryCabinModule_Wentian_DZD|KCHS_LaboratoryCabinModule_MENGTIAN_XZD|KCHS_LaboratoryCabinModule_WENTIAN_XZD]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = HumanRated }
}

// ---------- Reentry ----------
// 再入部件：返回舱、热盾、降落伞。触发 RP-1 再入/EDL 逻辑。
// 9 part(s)
@PART[KCHS_SZ_Re_entryModule|KCHS_Mengzhou_ReEntry_Module|KCHS_Lanyue_Crew_Compartment|KCHS_SZ_HeatShield|KCHS_Mengzhou_Heat_Shield|KCHS_SZ_MainParachute|KCHS_SZ_SpareParachute|KCHS_Mengzhou_Drogue_Chute|KCHS_Mengzhou_Main_Chute]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = Reentry }
}

// ---------- NoResourceCostMult ----------
// 成本不乘 RP-1 资源倍率的部件：载人舱、服务舱、仪器舱/控制舱。
// 21 part(s)
@PART[KCHS_SZ_Re_entryModule|KCHS_Mengzhou_ReEntry_Module|KCHS_Lanyue_Crew_Compartment|KCHS_SZ_OrbitalModule|KCHS_TG_LaboratoryModule|KCHS_Tianhe_JDC|KCHS_Tianhe_JXB|KCHS_Tianhe_DZD|KCHS_Tianhe_XZD|KCHS_LaboratoryCabinModule_XJXB|KCHS_LaboratoryCabinModule_Mengtian_DZD|KCHS_LaboratoryCabinModule_Wentian_DZD|KCHS_LaboratoryCabinModule_MENGTIAN_XZD|KCHS_LaboratoryCabinModule_WENTIAN_XZD|KCHS_SZ_ServiceModule|KCHS_Mengzhou_Service_Module|KCHS_TG_ServiceModule|KCHS_TZ_ServiceModule|KCHS_Lanyue_Service_Module|KCHS_LaboratoryCabinModule_FWC|KCHS_Tianhe_FWC]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = NoResourceCostMult }
}

// ---------- Instruments ----------
// 天线（RP-1 把天线归为 Instruments 类）。
// 4 part(s)
@PART[KCHS_TG_Antenna|KCHS_TZ_Antenna|KCHS_Tianhe_antenna|KCHS_LaboratoryCabinModule_antenna]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = Instruments }
}

// ---------- Avionics ----------
// 仪器舱/飞行控制舱(FWC)。触发 RP-1 航空电子 Tooling。
// 2 part(s)
@PART[KCHS_LaboratoryCabinModule_FWC|KCHS_Tianhe_FWC]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = Avionics }
}
// ===========================================================================
// KCHS RP-1 开模(Tooling)补丁
// 按 RP-1 现有定义(SSPX.cfg 写法)为固定尺寸载人舱/空间站舱段显式添加 ModuleToolingDiamLen。
// 载人舱/加压舱 -> CrewTube ; 推进舱/服务舱/货舱 -> SM-IV
// 尺寸为公开数据/估算值，仅用于开模成本计算与 UI 展示。
// 发动机已由 ModuleEngineConfigs + RP-0 自行处理，无需在此添加。
// ===========================================================================

// ---------------- 载人舱/加压舱 (CrewTube) ----------------

@PART[KCHS_SZ_Re_entryModule]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	MODULE
	{
		name = ModuleToolingDiamLen
		toolingName = Tool Crew Tube
		toolingType = CrewTube
		untooledMultiplier = 0.1
		finalToolingCostMultiplier = 3
		costMultiplierDL = 10
		partDiameter = 2.5
		partLength = 2.5
	}
}

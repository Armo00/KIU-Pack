// Top hatch uses FreeIVA standard hide-on-open behavior; side handle invokes real EVA.
@INTERNAL[KIU_Mengzhou_IVA]:NEEDS[FreeIva]
{
    MODULE
    {
        name = InternalModuleFreeIva
        shellColliderName = Mengzhou_FreeIvaShell
        externalDepthMaskName = Mengzhou_ExternalMask
        internalDepthMaskName = 
        shellColliderName = Mengzhou_FloorCollider
        shellColliderName = Mengzhou_SideHatchFrameCollider
    }
    MODULE
    {
        name = HandRail
        transformName = Mengzhou_UpperHandrailZone_L
    }
    MODULE
    {
        name = HandRail
        transformName = Mengzhou_UpperHandrailZone_R
    }
}
@PROP[KIU_MZ_TopHatch]:NEEDS[FreeIva]
{
    MODULE
    {
        name = FreeIvaHatch
        doorTransformName = MZ_TopHatch_Door
        handleTransformName = MZ_TopHandle
        attachNodeId = DocNode
        inwardsDirection = 0, -1, 0
    }
}
@PROP[KIU_MZ_SideHatch]:NEEDS[FreeIva]
{
    MODULE
    {
        name = FreeIvaHatch
        doorTransformName = MZ_SideHatch_Moving
        handleTransformName = MZ_EVARelease
        isEvaHatch = true
        airlockName = Airlock
        inwardsDirection = 0, 0, 1
    }
}

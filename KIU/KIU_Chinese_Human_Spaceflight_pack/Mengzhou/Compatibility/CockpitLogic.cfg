// Real capsule state; no aircraft gear/landing-slope or engine alarms.
RPM_CUSTOM_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_CABIN_ON
    operator = AND
    SOURCE_VARIABLE
    {
        name = PERSISTENT_KIU_MZ_CabinLight
        range = 0.5, 1.5
    }
}
RPM_CUSTOM_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_CABIN_OFF
    operator = AND
    SOURCE_VARIABLE
    {
        name = PERSISTENT_KIU_MZ_CabinLight
        range = -0.1, 0.5
    }
}
RPM_CUSTOM_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_DECK_ON
    operator = AND
    SOURCE_VARIABLE
    {
        name = PERSISTENT_KIU_MZ_DeckLight
        range = 0.5, 1.5
    }
}
RPM_CUSTOM_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_DECK_OFF
    operator = AND
    SOURCE_VARIABLE
    {
        name = PERSISTENT_KIU_MZ_DeckLight
        range = -0.1, 0.5
    }
}
RPM_SELECT_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_RCS_AMOUNT
    defaultValue = 0
    VARIABLE_DEFINITION
    {
        name = SYSR_HYDRAZINEMAX
        range = 0.000001, 1000000000000
        value = SYSR_HYDRAZINE
    }
    VARIABLE_DEFINITION
    {
        name = SYSR_MONOPROPELLANTMAX
        range = 0.000001, 1000000000000
        value = SYSR_MONOPROPELLANT
    }
}
RPM_SELECT_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_RCS_MAX
    defaultValue = 1
    VARIABLE_DEFINITION
    {
        name = SYSR_HYDRAZINEMAX
        range = 0.000001, 1000000000000
        value = SYSR_HYDRAZINEMAX
    }
    VARIABLE_DEFINITION
    {
        name = SYSR_MONOPROPELLANTMAX
        range = 0.000001, 1000000000000
        value = SYSR_MONOPROPELLANTMAX
    }
}
RPM_CUSTOM_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_RCS_AVAILABLE
    operator = OR
    SOURCE_VARIABLE
    {
        name = SYSR_HYDRAZINEMAX
        range = 1e-06, 1000000000000.0
    }
    SOURCE_VARIABLE
    {
        name = SYSR_MONOPROPELLANTMAX
        range = 1e-06, 1000000000000.0
    }
}
RPM_MATH_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_RCS_FRACTION
    operator = DIVIDE
    sourceVariable = SELECT_KIU_MZ_RCS_AMOUNT
    sourceVariable = SELECT_KIU_MZ_RCS_MAX
}
RPM_CUSTOM_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_LOW_RCS10
    operator = AND
    SOURCE_VARIABLE
    {
        name = CUSTOM_KIU_MZ_RCS_AVAILABLE
        range = 0.5, 1.5
    }
    SOURCE_VARIABLE
    {
        name = MATH_KIU_MZ_RCS_FRACTION
        range = -1e-05, 0.1
    }
}
RPM_CUSTOM_VARIABLE:NEEDS[ASET,RasterPropMonitor]
{

// This IVA fits the current 4.05 m / rescaleFactor=1.0 configuration.
// FINAL is intentionally scoped to this one part, after its optional scale patches.
// The unpatched 0.6 configuration keeps its existing internal until separately adapted.
@PART[KCHS_Mengzhou_ReEntry_Module]:HAS[#rescaleFactor[1.0]]:FINAL
{
    @CrewCapacity = 7
    %INTERNAL
    {
        %name = KIU_Mengzhou_IVA
    }
    %MODULE[ModuleFreeIva]:NEEDS[FreeIva]
    {
        %name = ModuleFreeIva
    }
    %MODULE[RasterPropMonitorComputer]:NEEDS[ASET,RasterPropMonitor]
    {
        %name = RasterPropMonitorComputer
        %storedStrings = MENGZHOU|RETURN MODULE|7 CREW|KIU
    }
}

// Own geometry. Optional plugins add behavior without duplicating models.
PROP
{
    name = KIU_MZ_Table
    MODEL
    {
        model = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Spaces/Mengzhou_Table
        texture = MZWhite, KIU/Common/KIU_Common_texture/Shared_White.v3.3.0
    }
}

PROP
{
    name = KIU_MZ_Privacy
    MODEL
    {
        model = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Spaces/Mengzhou_Privacy
        texture = MZWhite, KIU/Common/KIU_Common_texture/Shared_White.v3.3.0
    }
}

PROP
{
    name = KIU_MZ_SideHatch
    MODEL
    {
        model = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Spaces/Mengzhou_SideHatch
        texture = MZWhite, KIU/Common/KIU_Common_texture/Shared_White.v3.3.0
    }
}

PROP
{
    name = KIU_MZ_TopHatch
    MODEL
    {
        model = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Spaces/Mengzhou_TopHatch
        texture = MZWhite, KIU/Common/KIU_Common_texture/Shared_White.v3.3.0
    }
}

@PROP[KIU_MZ_Table]:NEEDS[RasterPropMonitor]
{
    MODULE
    {
        name = JSIActionGroupSwitch
        animationName = Mengzhou_TableFold
        switchTransform = Table_Handle
        actionName = dummy
        perPodPersistenceName = KIU_MZ_Table
        initialState = false
        needsElectricCharge = false
        customSpeed = 1
    }
}

@PROP[KIU_MZ_Privacy]:NEEDS[RasterPropMonitor]
{
    MODULE
    {
        name = JSIActionGroupSwitch
        animationName = Mengzhou_PrivacyFold
        switchTransform = Privacy_Handle
        actionName = dummy
        perPodPersistenceName = KIU_MZ_Privacy
        initialState = false
        needsElectricCharge = false
        customSpeed = 1
    }
}


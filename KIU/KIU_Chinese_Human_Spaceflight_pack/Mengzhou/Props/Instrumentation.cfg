        name = JSILabel
        transformName = DigitIndicatorNameObj
        alignment = Right
        anchor = UpperRight
        transformOffset = 0.095,-0.004
        variableName = SAS
        positiveColor = COLOR_ASET_DIGITALINDICATOR_NORMAL_COLOR
        negativeColor = COLOR_ASET_DIGITALINDICATOR_STBY_COLOR
    }

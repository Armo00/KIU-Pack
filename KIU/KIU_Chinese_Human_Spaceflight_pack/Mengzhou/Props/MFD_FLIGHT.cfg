PROP:NEEDS[ASET,RasterPropMonitor]
{
    name = KIU_MZ_MFD_FLIGHT
    MODEL
    {
        model = ASET/ASET_Props/MFDs/ALCORMFD40x20/ALCORMFD40X20
    }
    MODULE
    {
        PAGE
        {
            name = KIU_MZ_Return
            button = buttonR1
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/Return.txt
        }
        refreshDataRate = 4
        refreshTextRate = 4
        refreshDrawRate = 1
        name = RasterPropMonitor
        screenTransform = FlatMon40x10Screen
        fontTransform = ASET/ASET_Props/MFDs/Fonts/mainfont
        textureLayerID = _Emissive
        screenWidth = 40
        screenHeight = 20
        screenPixelWidth = 640
        screenPixelHeight = 640
        fontLetterWidth = 16
        fontLetterHeight = 32
        cameraAspect = 1.0
        fontDefinition = ASET/ASET_Props/MFDs/Fonts/fontDefinition.txt
        extraFont = ASET/ASET_Props/MFDs/Fonts/extraFont1
        extraFont = ASET/ASET_Props/MFDs/Fonts/InvertedMainFont
        extraFont = ASET/ASET_Props/MFDs/Fonts/InvertedExtraFont
        extraFont = ASET/ASET_Props/MFDs/Fonts/Symbols01
        emptyColor = 0,0,0,255
        buttonClickSound = Squad/Sounds/sound_click_tick
        buttonClickVolume = 0.6
        globalButtons = button_UP,button_DOWN,button_ENTER,button_ESC,button_HOME,button_RIGHT,button_LEFT,buttonR9,buttonR10
        noSignalTextureURL = ASET/ASET_Props/MFDs/ScreenPlates/nosignal
        PAGE
        {
            name = pALCORorbit40x20
            button = buttonR2
            PAGEHANDLER
            {
                name = JSIVariablePageTextSwitcher
                method = ShowPage
                pageActiveMethod = PageActive
                scale = 0,1
                variableName = MECHJEBAVAILABLE
                refreshRate = 10
                threshold = 0.1,1.1
                definitionIn = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORorbit40x20MJ.txt
                definitionOut = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORorbit40x20.txt
            }
            textureInterlayURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
        }
        PAGE
        {
            name = pALCORorbitDisplay40x20
            button = buttonR2
            textureInterlayURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            PAGEHANDLER
            {
                name = JSIVariablePageTextSwitcher
                method = ShowPage
                pageActiveMethod = PageActive
                scale = 0,1
                variableName = TARGETEXISTS
                refreshRate = 10
                threshold = 0.1,1.1
                definitionIn = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORorbitDisplay40x20.txt
                definitionOut = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORorbitDisplayNoTarget40x20.txt
            }
            BACKGROUNDHANDLER
            {
                name = JSIOrbitDisplay
                method = RenderOrbit
                orbitColorSelf = 0,255,0,255
                iconColorAP = 0,255,255,255
                iconColorPE = 255,128,0,255
                orbitColorNextNode = 0,0,255,255
                iconPixelSize = 20
                orbitDisplayPosition = 40,40,560,560
            }
        }
        PAGE
        {
            name = pFlightLog40x20
            button = buttonR4
            PAGEHANDLER
            {
                name = JSIFlightLog
                method = ShowLog
                pageTitle = $$$============= Flight Log ==================
                screenWidth = 40
                screenHeight = 18
            }
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            textOverlay = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORFlightLogOverlay.txt
        }
        PAGE
        {
            name = pALCORCrew40x20
            button = buttonR5
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORCrew40x20.txt
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            BACKGROUNDHANDLER
            {
                name = JSIVariableGraph
                method = RenderGraphs
                graphSet = CrewInfo
                xSpan = 500
                ySpan = 0,640
                graphRect = 320,0,625,640
                borders = 0
                secondsBetweenSamples = 3
            }
        }
        PAGE
        {
            name = pALCORSTBY40x20
            button = button_STBY
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORSTBY40x20.txt
        }
        PAGE
        {
            default = yes
            name = pALCORPFD40x20
            button = button_A
            BACKGROUNDHANDLER
            {
                name = JSIPrimaryFlightDisplay
                method = RenderPFD
                buttonClickMethod = ButtonProcessor
                speedModeButton = 3
                navBallModel = ASET/ASET_Props/MFDs/ALCORPFD/NavBall
                horizonTexture = ASET/ASET_Props/MFDs/ALCORPFD/NavBall000
                staticOverlay = ASET/ASET_Props/MFDs/ALCORPFD/StaticMask
                headingBar = ASET/ASET_Props/MFDs/ALCORPFD/HDG
                navBallCenter = 320,332
                navBallDiameter = 440
                markerSize = 75
                headingBarPosition = 320, 60, 160 , 15
                screenAspect = 1
                drawingLayer = 17
            }
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORPFD.txt
            textureInterlayURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
        }
        PAGE
        {
            name = pTargetMenu40x20
            button = button_B
            localMargins = 0,0,0,5
            PAGEHANDLER
            {
                name = JSITargetMenu
                method = ShowMenu
                buttonClickMethod = ButtonProcessor
                pageActiveMethod = PageActive
                buttonUp = 0
                buttonDown = 1
                buttonEnter = 2
                buttonEsc = 3
                buttonHome = 4
                pageTitle = $$$----------- Target management -----------
            }
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            textOverlay = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORTargetMenuOverlay.txt
        }
        PAGE
        {
            name = pALCORresources40x20
            button = button_G
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORresources40x20.txt
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
        }
        PAGE
        {
            button = button_D
            name = pALCORshipinfo40x20
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORshipinfo40x20.txt
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
        }
        PAGE
        {
            button = buttonR6
            name = pScience
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            textOverlay = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORScience40x20.txt
            PAGEHANDLER
            {
                name = JSIScienceDisplay
                method = Display
                buttonClickMethod = ButtonProcessor
                screenWidth = 40
                screenHeight = 18
                pageTitle = $$$=============== Science ===================
            }
        }
        PAGE
        {
            button = button_E
            name = ALCORGraphAltAtmAltDynPressAtm40x20
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORGraphAltAtmAltDynPressAtm40x20.txt
            textureInterlayURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            BACKGROUNDHANDLER
            {
                name = JSIVariableGraph
                method = RenderGraphs
                graphSet = AltAtmDynPresApPe
                xSpan = 400
                ySpan = 0,125000
                graphRect = 48,48,560,600
                borders = 4
                secondsBetweenSamples = 5
            }
        }
        PAGE
        {
            button = button_E
            name = ALCORGraphTerrainHeightScaner40x20
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORGraphTerrainHeightScaner40x20.txt
            textureInterlayURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            BACKGROUNDHANDLER
            {
                name = JSIVariableGraph
                method = RenderGraphs
                graphSet = TerrainHeightScaner2
                xSpan = 300
                ySpan = 0,390
                graphRect = 50,100,590,590
                borders = 4
                secondsBetweenSamples = 2
            }
        }
        PAGE
        {
            button = button_G
            name = pALCORresourcesStage40x20
            text = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/MZ_ALCORresourcesStage40x20.txt
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
        }
        PAGE
        {
            name = KIU_MZ_Docking
            button = buttonR3
            PAGEHANDLER
            {
                name = JSIVariablePageTextSwitcher
                method = ShowPage
                pageActiveMethod = PageActive
                scale = 0,1
                variableName = TARGETISDOCKINGPORT
                refreshRate = 2
                threshold = 0.1,1.1
                definitionIn = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/Docking.txt
                definitionOut = KIU/KIU_Chinese_Human_Spaceflight_pack/Mengzhou/Props/Pages/DockingNoTarget.txt
            }
        }
    }
    MODULE
    {
        name = JSICallbackAnimator
        variableName = CUSTOM_ALCOR_POWEROFF
        VARIABLESET
        {
            coloredObject = MFD_Buttons_Obj
            passiveColor = 0,0,0,255
            activeColor = COLOR_ASET_MFD_BACKLIGHT_ACTIVECOLOR
            scale = 0.0,0.5
        }
        VARIABLESET
        {
            coloredObject = FlatMon40x10Screen
            passiveColor = 0,0,0,255
            activeColor = 255,255,255,255
            scale = 0.0,0.5
        }
    }
}

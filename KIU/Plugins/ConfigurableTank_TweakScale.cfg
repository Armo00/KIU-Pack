// ConfigurableTank owns the combined length/scale mass and cost. Both original
// TweakScale and Rescaled otherwise apply another mass/cost multiplier.
// Keep geometry, resources and other TweakScale exponents intact.
@PART[*]:HAS[@MODULE[ConfigurableTank],@MODULE[TweakScale]]:NEEDS[TweakScale]:FINAL
{
    @MODULE[TweakScale]
    {
        %TWEAKSCALEEXPONENTS[TweakScale]
        {
            %MassScale = 0
            %DryCost = 0
        }
    }
}
